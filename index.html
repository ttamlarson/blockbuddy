<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">✕</button><h2 id="modalTitle">Block Buddy</h2><div id="modalBody"></div><div class="btnrow" id="modalButtons"></div></div></div>
<script type="module">
try {
let THREE;try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}catch(firstError){THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}
const $=id=>document.getElementById(id), root=$('game');
$('loading').style.display='none';
const SAVE_KEY='blockBuddy_v2_save';
const defaults={wood:0,stone:0,stars:0,collected:[],character:'blue',dragon:'buddy',player:[0,0,0],built:[],completed:[],visited:[],toolbox:[],roomDecor:[],settings:{quiet:false,motion:true,voice:false,openEnded:false,largeText:false}};
let state;try{const current=localStorage.getItem(SAVE_KEY);if(current){state={...defaults,...JSON.parse(current)}}else{const old=JSON.parse(localStorage.getItem('blockBuddySave')||'{}');const migratedBuilt=Array.isArray(old.placed)?old.placed.map(p=>({x:Number(p[0])||0,z:Number(p[2])||0,type:p[3]==='Stone block'?'stone':p[3]==='Golden block'?'gold':'dark'})):[];state={...defaults,wood:Number(old.wood)||0,stone:Number(old.stone)||0,stars:Number(old.stars)||0,player:Array.isArray(old.playerPos)?old.playerPos:[0,0,0],built:migratedBuilt}}state.settings={...defaults.settings,...(state.settings||{})}}catch{state={...defaults}}
document.body.classList.toggle('large-text',!!state.settings.largeText);
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){toast('This browser could not save just now. You can keep playing.')}};
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function updateHUD(){$('wood').textContent=state.wood;$('stone').textContent=state.stone;$('stars').textContent=state.stars}
function openModal(title,html,buttons=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalButtons').replaceChildren();for(const b of buttons){const el=document.createElement('button');el.className='btn '+(b.className||'');el.textContent=b.label;el.onclick=()=>{if(b.action)b.action();if(b.close!==false)closeModal()};$('modalButtons').append(el)}$('modalWrap').style.display='flex'}
function closeModal(){$('modalWrap').style.display='none';Object.keys(held).forEach(k=>held[k]=false)}$('closeModal').onclick=closeModal;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
// ----- Three-dimensional original block world -----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8d4);scene.fog=new THREE.Fog(0x9bc8d4,23,58);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x647b4b,2));const sun=new THREE.DirectionalLight(0xfff0ce,2);sun.position.set(9,17,8);sun.castShadow=true;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.95});const mats={grass:material(0x75a85e),dark:material(0x5f914d),wood:material(0x93613d),leaf:material(0x438653),stone:material(0x858e91),water:material(0x4b9dbb),sand:material(0xd6c18b),gold:material(0xf2c66d),roof:material(0xa65d4c),flower:material(0xf4c9dd),purple:material(0x9679c8),blue:material(0x4d91c5),skin:material(0xf1c7a1),white:material(0xf3ead1)};
const ground=new THREE.Mesh(new THREE.BoxGeometry(38,1,38),mats.grass);ground.position.y=-.55;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(38,38,0x426c43,0x68915c);grid.position.y=-.045;scene.add(grid);
const resources=[];const builtMeshes=[];function box(x,y,z,mat,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z){box(x,.5,z,mats.wood,.55,1.4,.55);box(x,1.65,z,mats.leaf,1.7,1.5,1.7);box(x,2.45,z,mats.leaf,1.1,1.1,1.1);const r=box(x+.65,.2,z,mats.wood,.48,.32,.48);r.userData.resource='wood';r.userData.id='wood:'+x+','+z;r.visible=!(state.collected||[]).includes(r.userData.id);resources.push(r)}
function rock(x,z){const r=box(x,.25,z,mats.stone,.9,.7,.8);r.userData.resource='stone';r.userData.id='stone:'+x+','+z;r.visible=!(state.collected||[]).includes(r.userData.id);resources.push(r)}
for(let x=-16;x<=16;x+=4){tree(x,-15);tree(x,15)}for(let z=-11;z<=11;z+=4){tree(-16,z);tree(16,z)}for(const p of [[-8,-6],[-6,8],[9,-7],[11,6],[-11,2],[3,12],[12,-1]])rock(...p);
// Pond, paths, village, cave and garden details
const pond=box(5,-.02,4,mats.water,5,.08,3.8);for(let i=-3;i<=3;i++){box(i*.8,-.01,-1,mats.sand,.65,.06,.65)}
function hut(x,z){box(x,.4,z,mats.sand,2.5,.9,2);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.9,1.35,4),mats.roof);roof.position.set(x,1.45,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof);box(x,.25,z-1.05,mats.wood,.6,.8,.12);box(x,.75,z-1.08,mats.gold,.18,.18,.04)}hut(-5,-4);hut(-8,0);hut(7,-8);
for(let i=0;i<20;i++){const x=-10+Math.random()*20,z=-10+Math.random()*20;if(Math.abs(x-5)>4||Math.abs(z-4)>3){const f=box(x,.12,z,i%2?mats.flower:mats.gold,.12,.24,.12);f.rotation.z=.25}}
// Mushroom grove
for(const [x,z] of [[-10,-9],[-8,-10],[-11,-7]]){box(x,.25,z,mats.white,.18,.5,.18);box(x,.58,z,mats.roof,.7,.2,.7)}
// crystal cave entrance
box(12,.65,10,mats.stone,2.8,1.3,1);box(12,1.3,10,mats.stone,2,.7,1);box(12,.6,9.45,material(0x253b4a),1.3,1.1,.08);
// floating lookout island silhouette
const island=box(-2,4,13,mats.sand,4,.7,3);box(-2,4.65,13,mats.grass,3.8,.25,2.8);for(let i=0;i<3;i++)box(-3+i,5.2,13,mats.leaf,.8,.9,.8);
// Scenic details: a sunlit valley, winding path, cloud islands, crystal garden and lanterns.
const sunOrb=new THREE.Mesh(new THREE.SphereGeometry(2.0,18,14),new THREE.MeshBasicMaterial({color:0xffe8a6}));sunOrb.position.set(-15,14,-18);scene.add(sunOrb);
const cloudMat=new THREE.MeshStandardMaterial({color:0xf6fbf2,roughness:1});
function cloud(x,y,z,s=1){const g=new THREE.Group();for(const [a,b,c,r] of [[0,0,0,1],[.8,.08,.1,.72],[-.7,-.04,.05,.66],[.15,.42,0,.68]]){const q=new THREE.Mesh(new THREE.BoxGeometry(1.2*r,.62*r,.85*r),cloudMat);q.position.set(a,b,c);g.add(q)}g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);return g}
const clouds=[cloud(-11,9,-9,1.4),cloud(3,11,-15,1.1),cloud(14,8,2,1.3),cloud(-2,12,17,1.2)];
// A winding stepping-stone path through the valley.
for(let i=0;i<11;i++){const p=box(-4+i*.72,-.015,-2-i*.9,mats.sand,.7,.08,.58);p.rotation.y=(i%2?-.18:.18)}
// Bushes, flowers and small block lanterns add visual landmarks.
for(const [x,z] of [[-12,-3],[-12,6],[-3,-12],[4,-12],[14,-4],[13,13],[-13,12]]){const b=box(x,.34,z,mats.leaf,.9,.62,.8);b.rotation.y=.3;for(let j=0;j<3;j++){const f=box(x+(j-1)*.22,.72,z+.08,mats.flower,.12,.22,.12)}}
for(const [x,z] of [[-6,-7],[0,-9],[8,1],[2,9]]){box(x,.65,z,mats.wood,.18,1.3,.18);box(x,1.35,z,mats.gold,.38,.3,.38)}
// Crystal garden around the cave entrance.
for(const [x,z,c] of [[10,8,0x78d9e8],[14,8,0xb59aff],[10,12,0x78d9e8],[14,12,0xb59aff]]){const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.55),material(c));crystal.position.set(x,.62,z);crystal.scale.y=1.5;crystal.castShadow=true;scene.add(crystal)}

// Character selection - two original blonde boys
const player=new THREE.Group();scene.add(player);function makeCharacter(shirt){player.clear();const shirtMat=shirt==='purple'?mats.purple:mats.blue;const torso=new THREE.Mesh(new THREE.BoxGeometry(.68,.9,.42),shirtMat);torso.position.y=.82;torso.castShadow=true;player.add(torso);const head=new THREE.Mesh(new THREE.BoxGeometry(.58,.58,.58),mats.skin);head.position.y=1.55;head.castShadow=true;player.add(head);const hair=box(0,0,0,material(0xe8c45d),.66,.22,.66);hair.position.set(0,1.87,0);player.add(hair);const fringe=box(0,0,0,material(0xe8c45d),.4,.17,.18);fringe.position.set(0,1.73,-.29);player.add(fringe);for(const x of [-.15,.15]){const eye=box(0,0,0,material(0x263b35),.07,.075,.035);eye.position.set(x,1.58,-.302);player.add(eye)}const smile=box(0,0,0,material(0x9c5d4e),.13,.025,.025);smile.position.set(0,1.43,-.305);player.add(smile);const armMat=shirtMat,legmat=material(0x34485a);const arms=[],legs=[];for(const x of [-.43,.43]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.2,.62,.22),armMat);arm.position.set(x,.87,0);arm.castShadow=true;player.add(arm);arms.push(arm)}for(const x of [-.19,.19]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.48,.25),legmat);leg.position.set(x,.24,0);leg.castShadow=true;player.add(leg);legs.push(leg)}player.userData.limbs={arms,legs};}
makeCharacter(state.character);player.position.set(...(Array.isArray(state.player)?state.player:[0,0,0]));
// Four original dragon companions
const dragon=new THREE.Group();scene.add(dragon);const dragonDefs={buddy:{name:'Buddy',color:0x70bd8c,wing:0x4f9d7b,description:'A gentle, encouraging friend.'},ember:{name:'Ember',color:0xe8895f,wing:0xc65e48,description:'Brave and good at trying a new plan.'},sparky:{name:'Sparky',color:0xe7c75e,wing:0xb58c38,description:'Curious and loves puzzles.'},blaze:{name:'Blaze',color:0x9679c8,wing:0x7055a8,description:'Confident and remembers boundaries.'}};
function makeDragon(key){dragon.clear();const d=dragonDefs[key]||dragonDefs.buddy,bodyMat=material(d.color),wingMat=material(d.wing);const body=new THREE.Mesh(new THREE.BoxGeometry(.85,.55,.7),bodyMat);body.position.y=.62;body.castShadow=true;dragon.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.42,.48),bodyMat);head.position.set(0,.98,-.32);dragon.add(head);const snout=new THREE.Mesh(new THREE.BoxGeometry(.3,.2,.2),bodyMat);snout.position.set(0,.88,-.62);dragon.add(snout);for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.85),wingMat);wing.position.set(side*.52,.85,.05);wing.rotation.z=side*-.35;wing.castShadow=true;dragon.add(wing);const horn=new THREE.Mesh(new THREE.ConeGeometry(.09,.28,5),mats.gold);horn.position.set(side*.16,1.3,-.3);dragon.add(horn);const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),material(0x182b28));eye.position.set(side*.13,1.05,-.57);dragon.add(eye);const foot=new THREE.Mesh(new THREE.BoxGeometry(.2,.18,.22),bodyMat);foot.position.set(side*.24,.25,.18);dragon.add(foot)}const tail=new THREE.Mesh(new THREE.ConeGeometry(.18,.9,5),bodyMat);tail.rotation.x=Math.PI/2;tail.position.set(0,.58,.67);dragon.add(tail);dragon.userData.wings=dragon.children.filter((o,i)=>i===3||i===7);dragon.position.set(1,0,1)}makeDragon(state.dragon);
// Restore built blocks

function bindHold(el,key){const on=e=>{e.preventDefault();held[key]=true;try{el.setPointerCapture(e.pointerId)}catch{}};const off=e=>{e.preventDefault();held[key]=false};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,off))}document.querySelectorAll('[data-move]').forEach(el=>bindHold(el,el.dataset.move));addEventListener('keydown',e=>{const k=keys[e.key];if(k){e.preventDefault();held[k]=true}});addEventListener('keyup',e=>{const k=keys[e.key];if(k)held[k]=false});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function collect(){let found=null,best=3.2;for(const r of resources){if(!r.visible)continue;const d=player.position.distanceTo(r.position);if(d<best){best=d;found=r}}if(!found){toast('Move closer to a tree or rock to collect nearby materials.');return}found.visible=false;state.collected=Array.isArray(state.collected)?state.collected:[];if(found.userData.id&&!state.collected.includes(found.userData.id))state.collected.push(found.userData.id);state[found.userData.resource]++;state.stars++;updateHUD();save();toast(found.userData.resource==='wood'?'Wood collected. Nice exploring!':'Stone collected. Nice exploring!')}
function build(){const html='<p>Choose a block for your world. Building is creative play; there is no wrong design.</p><div class="cardgrid"><button class="choice" data-build="dark"><b>🌱 Meadow block</b><span>Costs 1 wood</span></button><button class="choice" data-build="stone"><b>🪨 Stone block</b><span>Costs 2 stone</span></button><button class="choice" data-build="gold"><b>⭐ Golden block</b><span>Costs 3 wood</span></button></div>';openModal('Builder’s Workshop',html);document.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>{const type=el.dataset.build,cost=type==='stone'?2:type==='gold'?3:1,resource=type==='stone'?'stone':'wood';if(state[resource]<cost){toast(`You need ${cost} ${resource}. You can explore and collect more, or build later.`);return}state[resource]-=cost;const dir=new THREE.Vector3(0,0,-2).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const x=Math.round(player.position.x+dir.x),z=Math.round(player.position.z+dir.z);if(state.built.some(b=>b.x===x&&b.z===z)){state[resource]+=cost;toast('That space is already occupied. Try another spot.');updateHUD();return}state.built.push({x,z,type});builtMeshes.push(box(x,.5,z,mats[type],1,1,1));state.stars++;updateHUD();save();closeModal();toast('Your block is part of the world now!')})}

function scenarioDone(id){if(!state.completed.includes(id)){state.completed.push(id);state.stars+=2;updateHUD();save()}}
function runScenario(id){const s=scenarios.find(x=>x.id===id);if(!s)return;const choices=s.choices.map((c,i)=>`<button class="btn" data-choice="${i}">${c[0]}</button>`).join('');openModal(s.title,`<p class="muted">${s.area} · ${s.dragon}</p><p>${s.intro}</p><p><b>${s.prompt}</b></p><div class="btnrow" style="display:grid;grid-template-columns:1fr">${choices}</div>${state.settings.openEnded?'<div class="activity"><label for="ownStoryIdea">Or write your own idea</label><textarea id="ownStoryIdea" placeholder="My idea is…"></textarea><button class="btn" id="saveOwnStoryIdea">Save my idea</button></div>':''}<p class="muted">There is no test and no bad answer. Pick an idea, or close the adventure and return later.</p>`,[{label:'🔊 Read this story aloud',action:()=>sayLine(s.intro+' '+s.prompt),close:false},{label:'Back to adventures',action:showAdventures}]);document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{const c=s.choices[Number(el.dataset.choice)];scenarioDone(id);sayLine(c[1]);openModal('A possibility to explore',`<p>${c[1]}</p><p><b>Skill this adventure offers practice with:</b> ${s.skill}</p><p>You can try another choice, replay this adventure or explore somewhere else.</p>`,[{label:'Try another choice',className:'primary',action:()=>runScenario(id)},{label:'Back to adventures',action:()=>showAdventures()},{label:'Finish for now',action:()=>{}}])});const own=$('saveOwnStoryIdea');if(own)own.onclick=()=>{const v=$('ownStoryIdea').value.trim();if(v){state.toolbox.push('My idea for '+s.title+': '+v);save();toast('Your idea is saved in your toolbox.')}else toast('You can write an idea first, or skip it.')}}
function showAdventures(){const stories=scenarios.map(s=>`<button class="choice" data-scenario="${s.id}"><b>📖 ${s.title}</b><span>${s.area}${state.completed.includes(s.id)?' · ★ explored':''}</span></button>`).join('');const games=[['builder','🏗️','Build & Tell','Create a build and share your idea'],['feelings','🌤️','Feelings Quest','Notice feelings and choose a support'],['together','🤝','Team Quest','Explore friendship and different ideas'],['focus','🔎','Focus Finder','Patterns, attention and memory'],['creature','🐾','Creature Care','Notice what a creature might need'],['treasure','🗝️','Treasure Trail','Remember a gentle symbol sequence'],['weather','🌦️','Weather Station','Match weather with comfort choices'],['bridge','🌉','Bridge Builder','Build a path using blocks'],['story','📚','Story Portal','Create an original adventure']];const cards=games.map(g=>`<button class="choice" data-mini="${g[0]}"><b>${g[1]} ${g[2]}</b><span>${g[3]}</span></button>`).join('');openModal('Adventure & Play Hub',`<p>Pick a story or a creative game. You can leave at any time, replay favourites or just keep exploring the world. Nothing is timed and no progress is lost when you take a break.</p><h3>Story adventures</h3><div class="cardgrid">${stories}</div><h3 style="margin-top:18px">Creative mini-games</h3><div class="cardgrid">${cards}</div><div class="footer">These are optional play experiences, not tests. You can talk, type, point, choose a picture or simply explore.</div>`);document.querySelectorAll('[data-scenario]').forEach(el=>el.onclick=()=>runScenario(el.dataset.scenario));document.querySelectorAll('[data-mini]').forEach(el=>el.onclick=()=>startMiniGame(el.dataset.mini))}

function miniStory(){const parts=[['Who is the hero?',['A dragon 🐉','A brave builder 👦','A friendly robot 🤖']],['Where do they go?',['Crystal Cave 💎','Mushroom Forest 🍄','Floating Island ☁️']],['What happens?',['A surprise visitor 🎁','A wobbly bridge 🌉','A hidden treasure ⭐']]];let n=0,chosen=[];function show(){openModal('Story Portal',`<p>${parts[n][0]}</p><div class="btnrow" style="display:grid">${parts[n][1].map((x,i)=>`<button class="btn" data-story="${i}">${x}</button>`).join('')}</div>`,[{label:'Skip this part',action:()=>{chosen.push('something unexpected');next()} }]);document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{chosen.push(parts[n][1][+b.dataset.story]);next()})}function next(){n++;if(n<parts.length)show();else finish()}function finish(){openModal('Your story!',`<p>${chosen.join(' travels to ')}.</p><p>You made your own story. You can change any part whenever you like.</p>`,[{label:'Make another story',className:'primary',action:miniStory},{label:'Finish',action:showAdventures}])}show()}
function showPlaces(){const places=[['village','🏡','Village Home','A cosy place to make a room feel like yours.',[-5,0,-4]],['cave','💎','Crystal Cave','A quiet cave with glowing crystals and space to explore.',[12,0,8]],['grove','🍄','Mushroom Grove','A gentle place to meet tiny creatures and look around.',[-9,0,-9]],['pond','🌊','Bluebell Pond','A peaceful place beside the water.',[5,0,4]],['lookout','☁️','Floating Lookout','A high place to imagine a new adventure.',[-2,0,13]]];openModal('Places in Greenblock Valley',`<p>Choose somewhere to visit. You can return to the valley whenever you like.</p><div class="cardgrid">${places.map(p=>`<button class="choice" data-place="${p[0]}"><b>${p[1]} ${p[2]}</b><span>${p[3]}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x[0]===b.dataset.place);state.visited=Array.isArray(state.visited)?state.visited:[];if(!state.visited.includes(p[0]))state.visited.push(p[0]);state.player=[p[4][0],0,p[4][2]];player.position.set(...state.player);save();const decor=(state.roomDecor||[]).map(x=>`<span class="pill" style="display:inline-block;margin:4px">${x}</span>`).join('');const extras=p[0]==='village'?`<p>Pick a cosy detail for your room:</p><div class="btnrow">${['🛏️ Bed','🪴 Plant','🖼️ Picture','🧸 Soft toy','📚 Bookshelf','🪟 Window'].map(x=>`<button class="btn" data-decor="${x}">${x}</button>`).join('')}</div><p class="muted">Your saved room decorations:</p><div>${decor||'No decorations yet.'}</div>`:p[0]==='cave'?'<p>Look for a crystal, take a quiet moment or ask your dragon to explore beside you.</p>':p[0]==='grove'?'<p>Imagine what a little creature might enjoy: a resting spot, a friend, space or a new game.</p>':p[0]==='pond'?'<p>You can pause here, watch the water or choose a quiet activity. No task is waiting.</p>':'<p>Look across the valley and invent a story about somewhere you would like to explore next.</p>';openModal(p[2],`<p>${p[3]}</p>${extras}`,[{label:'Back to places',className:'primary',action:showPlaces},{label:'Back to world',action:closeModal}]);document.querySelectorAll('[data-decor]').forEach(d=>d.onclick=()=>{state.roomDecor=Array.isArray(state.roomDecor)?state.roomDecor:[];state.roomDecor.push(d.dataset.decor);save();toast('Decoration saved to your room!');showPlaces()})})}
function showToolbox(){const tools=[['🌿','I need a break','Find a quiet place or pause the game.','break'],['🙋','I need help','Practise asking a person or dragon for help.','help'],['😤','I feel frustrated','Notice the feeling and choose what might help.','frustrated'],['🗣️','I need to say something','Try words for a need, boundary or request.','speak'],['🔄','Plans changed','Explore another option or ask for more information.','change'],['🧘','Help my body feel settled','Try a gentle breathing or sensory choice.','calm'],['🛑','I want something to stop','Practise clear words and getting trusted adult help.','stop'],['💡','I have an idea','Save a personal strategy that works for you.','idea']];const html='<p>Your toolbox is always available. Pick a tool that feels useful, or close this window. You do not have to use any of them.</p><div class="toolbox">'+tools.map(t=>`<button class="tool" data-tool="${t[3]}"><span style="font-size:23px">${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small></button>`).join('')+'</div><div class="footer">A tool is an option, not an instruction. If something feels unsafe, uncomfortable or too much, it is okay to move away and ask a trusted adult for help.</div>';openModal('My Dragon Toolbox',html);document.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>toolDetail(el.dataset.tool))}
function toolDetail(id){const data={break:['Taking a break','You can pause, sit somewhere quiet, stretch, get a drink or do something you enjoy. You do not lose progress by taking a break.',['Quiet garden','Stretch','Drink of water','Return later']],help:['Asking for help','Try a phrase, show a picture, point to the help button or ask a trusted person to come over.',['Can you help me?','I’m not sure what to do.','Can you show me?']],frustrated:['When I feel frustrated','Frustration can be a signal that something is hard, unexpected or not working. You do not have to make the feeling vanish.',['Pause for a moment','Try a different plan','Ask for help','Move to a calmer place']],speak:['Words I can use','You can say these, type them, point to them or choose a picture.',['Please stop.','I need some space.','I don’t like that.','Can you explain?','I need help.']],change:['When plans change','You can ask what changed, find out what happens next, choose another plan or take time to think.',['What changed?','What happens next?','Show me my choices.','I need a minute.']],calm:['Help my body feel settled','Different things help different people. Choose what feels comfortable. You can skip all of these.',['Slow gentle breaths','Listen to a quiet sound','Look at a familiar picture','Rock or move gently','Find a quieter space']],stop:['When I want something to stop','Your body and belongings matter. You can use a clear stop message and move away. If someone does not respect it or you feel unsafe, tell a trusted adult.',['Stop, please.','I don’t want that.','Move back, please.','I’m getting a trusted adult.']],idea:['My own helpful idea','What helps you when something feels tricky? You can choose a strategy to remember.',['Build something else','Talk to someone I trust','Take a quiet break','Use my own words']]};const d=data[id];const html=`<p>${d[1]}</p><div class="btnrow" style="display:grid;grid-template-columns:1fr">${d[2].map(x=>`<button class="btn" data-phrase="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}</div><p class="muted">Choose one to save it to your personal toolbox, or just explore it without saving.</p>`;openModal(d[0],html);document.querySelectorAll('[data-phrase]').forEach(el=>el.onclick=()=>{const p=el.dataset.phrase;if(!state.toolbox.includes(p)){state.toolbox.push(p);save()}toast('Added to My Toolbox.');openModal('Saved to My Toolbox',`<p>“${p}” is in your toolbox. You can use it in the game whenever you want.</p>`,[{label:'Back to toolbox',className:'primary',action:showToolbox}])})}
function showParentCorner(){const explored=scenarios.filter(s=>state.completed.includes(s.id));const tools=state.toolbox.length?state.toolbox.map(x=>`<li>${x}</li>`).join(''):'<li>No personal strategies saved yet.</li>';const rows=scenarios.map(s=>`<li>${s.title}: ${state.completed.includes(s.id)?'Explored':'Not explored yet'}</li>`).join('');openModal('Parent Corner',`<p>This private-on-device overview is for noticing what your child chooses to explore. It is not a behaviour score, developmental assessment or measure of progress.</p><div class="activity"><h3>Adventure journal</h3><p>${explored.length} of ${scenarios.length} adventures explored</p><div class="bar"><i style="width:${Math.round(explored.length/scenarios.length*100)}%"></i></div><ul>${rows}</ul></div><div class="activity"><h3>Strategies saved in My Toolbox</h3><ul>${tools}</ul></div><div class="activity"><h3>Ideas for supporting play</h3><ul><li>Follow his interests and let him choose the activity.</li><li>Accept speech, pointing, typing, pictures or in-game actions.</li><li>Talk about a scenario only if he wants to; don't quiz him afterwards.</li><li>Notice which options he returns to and offer those tools in real life when appropriate.</li><li>If a scenario feels uncomfortable, skip it or adapt it together.</li></ul></div><p class="muted">All progress is stored in this browser on this device. Export a backup if you want to keep it. Block Buddy is an enjoyable practice environment, not therapy or a diagnostic tool.</p>`,[{label:'Back to world settings',className:'primary',action:showMenu}])}
function showMenu(){openModal('Your Block Buddy world',`<p>Make the world feel comfortable. Your choices are saved on this device.</p><div class="activity"><h3>Choose your adventurer</h3><div class="cardgrid"><button class="choice ${state.character==='blue'?'selected':''}" data-character="blue"><b>👦 Blue shirt</b><span>Blonde boy adventurer</span></button><button class="choice ${state.character==='purple'?'selected':''}" data-character="purple"><b>👦 Purple shirt</b><span>Blonde boy adventurer</span></button></div></div><div class="activity"><h3>Choose your dragon companion</h3><div class="cardgrid">${Object.entries(dragonDefs).map(([k,d])=>`<button class="choice ${state.dragon===k?'selected':''}" data-dragon="${k}"><b>🐉 ${d.name}</b><span>${d.description}</span></button>`).join('')}</div></div><div class="activity"><h3>Comfort & access settings</h3><p class="muted">All settings are optional. Change them whenever you like.</p><button class="btn" id="motionToggle">Reduced movement: ${state.settings.motion?'Off':'On'}</button><button class="btn" id="quietToggle">Quiet prompts: ${state.settings.quiet?'On':'Off'}</button><button class="btn" id="voiceToggle">Read story aloud: ${state.settings.voice?'On':'Off'}</button><button class="btn" id="openEndedToggle">Open-ended prompts: ${state.settings.openEnded?'On':'Off'}</button><button class="btn" id="largeTextToggle">Larger text: ${state.settings.largeText?'On':'Off'}</button></div><div class="activity"><h3>Save & family tools</h3><p>${state.completed.length} adventures explored · ${state.toolbox.length} saved ideas · ${state.built.length} blocks built</p><button class="btn" id="visitPlaces">🗺 Visit places in Greenblock Valley</button><button class="btn" id="parentCorner">👨‍👩‍👦 Parent Corner</button><button class="btn" id="exportSave">⬇ Export my world save</button><button class="btn" id="importSave">⬆ Import a world save</button><button class="btn" id="resetWorld">↻ Reset the world layout</button><input type="file" id="saveFile" accept="application/json" hidden></div><div class="footer">Block Buddy stores saves in this browser on this device. Export a backup before clearing browser data or changing devices. It is a family play tool, not a medical treatment or replacement for professional support.</div>`);document.querySelectorAll('[data-character]').forEach(el=>el.onclick=()=>{state.character=el.dataset.character;makeCharacter(state.character);save();showMenu()});document.querySelectorAll('[data-dragon]').forEach(el=>el.onclick=()=>{state.dragon=el.dataset.dragon;makeDragon(state.dragon);save();showMenu()});$('motionToggle').onclick=()=>{state.settings.motion=!state.settings.motion;save();showMenu()};$('quietToggle').onclick=()=>{state.settings.quiet=!state.settings.quiet;save();$('hint').textContent=state.settings.quiet?'Explore at your own pace.':'Your world is ready. Try the Toolbox whenever you want.';showMenu()};$('voiceToggle').onclick=()=>{state.settings.voice=!state.settings.voice;save();showMenu()};$('openEndedToggle').onclick=()=>{state.settings.openEnded=!state.settings.openEnded;save();showMenu()};$('largeTextToggle').onclick=()=>{state.settings.largeText=!state.settings.largeText;document.body.classList.toggle('large-text',state.settings.largeText);save();showMenu()};$('visitPlaces').onclick=showPlaces;$('parentCorner').onclick=showParentCorner;$('exportSave').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='block-buddy-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importSave').onclick=()=>$('saveFile').click();$('saveFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());state={...defaults,...d,settings:{...defaults.settings,...(d.settings||{})}};save();location.reload()}catch{toast('That save file could not be read.')}};$('resetWorld').onclick=()=>{if(confirm('Reset the world layout and collected resources? Your adventures and saved toolbox will remain.')){state.wood=0;state.stone=0;state.built=[];state.player=[0,0,0];save();location.reload()}}}
// Build/collect and buttons
$('collect').onclick=collect;$('build').onclick=build;$('toolboxBtn').onclick=showToolbox;$('adventuresBtn').onclick=showAdventures;$('menuBtn').onclick=showMenu;
// Tap the dragon greeting from the hint panel; no spoken response is required.
$('hint').style.cursor='pointer';$('hint').title='Tap to hear from your dragon';$('hint').addEventListener('click',()=>dragonHello());
// Friendly optional dragon greeting, no speech required
function dragonHello(){const d=dragonDefs[state.dragon];sayLine(`Hello, explorer. I'm ${d.name}. We can build, try an adventure, use your toolbox or just wander. You choose.`);openModal(`${d.name} says hello!`,`I’m glad we’re exploring together. We can build, try an adventure, use the toolbox or just wander. You choose.`,[{label:'Explore together',className:'primary',action:()=>closeModal()},{label:'Open my toolbox',action:showToolbox}])}
// Simple quest / story prompt available through village interaction (also via adventures menu)
$('hint').textContent=state.settings.quiet?'Explore at your own pace.':'Your world is ready. ▲ moves forward, ◀ and ▶ move across the screen. Drag the world to turn the camera. Tap here to talk with your dragon.';
updateHUD();
// Camera and movement orientation are consistent: forward is away from the camera; left/right are screen-relative.
// Character model's face is built toward local -Z, so this rotation keeps the face aligned with movement.
function setReducedMotion(){const reduced=!state.settings.motion;scene.fog.near=reduced?28:23;scene.fog.far=reduced?65:58;}
setReducedMotion();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const speed=4.2;const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const move=new THREE.Vector3();if(held.forward)move.add(forward);if(held.back)move.sub(forward);if(held.right)move.add(right);if(held.left)move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(speed*dt);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);faceMovement(move)}const t=clock.elapsedTime;if(player.userData.limbs){const swing=state.settings.motion&&move.lengthSq()?Math.sin(t*11)*.42:0;player.userData.limbs.arms.forEach((a,i)=>a.rotation.x=(i?1:-1)*swing);player.userData.limbs.legs.forEach((l,i)=>l.rotation.x=(i?-1:1)*swing)}if(dragon.userData.wings&&state.settings.motion){dragon.userData.wings.forEach((w,i)=>w.rotation.z=(i===0?-1:1)*(.35+Math.sin(t*7)*.16))}dragon.position.x=THREE.MathUtils.damp(dragon.position.x,player.position.x+Math.sin(t*1.7)*1.05,3,dt);dragon.position.z=THREE.MathUtils.damp(dragon.position.z,player.position.z+1.3+Math.cos(t*1.3)*.4,3,dt);dragon.position.y=state.settings.motion ? 0.2+Math.sin(t*2.5)*0.13 : 0.15;dragon.rotation.y=Math.sin(t)*.12;const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);const offset=new THREE.Vector3(0,4.6,7.8).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(target.clone().add(offset),.09);camera.lookAt(target.x,target.y+pitch*2,target.z);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setInterval(()=>{state.player=[player.position.x,player.position.y,player.position.z];save()},4000);document.addEventListener('visibilitychange',()=>{if(document.hidden){state.player=[player.position.x,player.position.y,player.position.z];save()}});addEventListener('beforeunload',()=>{state.player=[player.position.x,player.position.y,player.position.z];save()});updateHUD();
} catch (error) {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.style.display = 'flex';
    loading.innerHTML = '<div class="loadcard"><strong>Block Buddy could not load yet.</strong><small>Check your internet connection and reload. The 3D engine is loaded securely from a CDN. Your saved world has not been deleted.</small><p><button class="btn primary" onclick="location.reload()">Try loading again</button></p></div>'; 
  }
  console.error('Block Buddy startup error:', error);
}
