<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14251f">
<title>Block Buddy — World Builder</title>
<style>
:root{--bg:#14251f;--panel:#20372e;--panel2:#29463a;--ink:#f4f1df;--muted:#c2d0c4;--accent:#f2c66d;--green:#8dc99b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.brand,.panel,.action{background:#14251fdd;border:1px solid #ffffff25;border-radius:14px;padding:10px 13px;backdrop-filter:blur(8px)}.brand strong{display:block;font-size:17px}.brand small{color:var(--muted)}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#29463a;border-radius:20px;padding:7px 10px;font-size:13px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px}.hint{max-width:290px;color:var(--muted);font-size:13px}.controls{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:5px;pointer-events:auto}.controls button,.actions button,.modal button{border:1px solid #ffffff30;border-radius:12px;background:#20372eee;color:var(--ink);font-size:19px;min-height:42px;padding:8px 12px}.controls button:active,.actions button:active,.modal button:active{background:#52745c}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}.actions button{font-size:13px;min-height:40px}.modal-wrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{width:min(440px,100%);background:var(--panel);border:1px solid #ffffff30;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0008}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.5}.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.modal button{font-size:14px}.modal .primary{background:#52745c}.close{float:right}.toast{position:fixed;left:50%;top:85px;transform:translateX(-50%);background:#14251fee;border:1px solid #ffffff30;border-radius:20px;padding:9px 14px;display:none;z-index:8;font-size:14px}#crosshair{position:fixed;left:50%;top:50%;width:8px;height:8px;border:1px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}@media(min-width:800px){.controls{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px)}.hint{font-size:14px}}
</style>
</head>
<body>
<div id="game"></div><div id="crosshair"></div><div class="toast" id="toast"></div>
<div id="hud"><div class="top"><div class="brand"><strong>Block Buddy</strong><small>Your little world, your way</small></div><div class="stats"><span class="pill">🪵 Wood: <b id="wood">0</b></span><span class="pill">🪨 Stone: <b id="stone">0</b></span><span class="pill">⭐ Stars: <b id="stars">0</b></span></div></div><div class="bottom"><div class="hint panel" id="hint">Explore your world. Tap Collect near a tree or rock, then build something wonderful.</div><div style="display:flex;gap:10px;align-items:end"><div class="controls"><button class="up" data-move="forward" aria-label="Move forward">▲</button><button class="left" data-move="left" aria-label="Move left">◀</button><button class="down" data-move="back" aria-label="Move back">▼</button><button class="right" data-move="right" aria-label="Move right">▶</button></div><div class="actions"><button id="collect">Collect</button><button id="build">Build</button><button id="buddy">Buddy</button><button id="quest">Quest</button><button id="reset">Reset</button></div></div></div></div>
<div class="modal-wrap" id="modalWrap"><div class="modal"><button class="close" id="closeModal">✕</button><h2 id="modalTitle">Hello!</h2><p id="modalText"></p><div class="row" id="modalButtons"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8d4);scene.fog=new THREE.Fog(0x9bc8d4,18,48);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,5,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x647b4b,2));const sun=new THREE.DirectionalLight(0xfff0ce,2.2);sun.position.set(8,15,7);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:1});const materials={grass:mat(0x75a85e),darkGrass:mat(0x5f914d),wood:mat(0x93613d),leaf:mat(0x438653),stone:mat(0x858e91),water:mat(0x4b9dbb),sand:mat(0xd6c18b),gold:mat(0xf2c66d),white:mat(0xf3ead1),blue:mat(0x4d91c5),red:mat(0xc76b54)};
const ground=new THREE.Mesh(new THREE.BoxGeometry(34,1,34),materials.grass);ground.position.y=-.55;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(34,34,0x426c43,0x68915c);grid.position.y=-.045;scene.add(grid);
const blocks=[];const resources=[];const collidable=[];
function cube(x,y,z,material,scale=1,kind='block'){const m=new THREE.Mesh(new THREE.BoxGeometry(scale,scale,scale),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;m.userData.kind=kind;scene.add(m);if(kind==='resource')resources.push(m);else if(kind==='block')blocks.push(m);return m}
function tree(x,z){cube(x,.5,z,materials.wood,.7,'decoration');const top=cube(x,1.7,z,materials.leaf,1.8,'resource');top.userData.resource='wood';top.userData.label='tree';cube(x,2.55,z,materials.leaf,1.1,'decoration')}
function rock(x,z){const r=cube(x,.25,z,materials.stone,.8,'resource');r.userData.resource='stone';r.userData.label='rock';r.rotation.set(.2,.4,.1)}
for(let x=-14;x<=14;x+=4){tree(x,-13);tree(x,13)}for(let z=-9;z<=9;z+=4){tree(-14,z);tree(14,z)}
for(const p of [[-7,-5],[-5,7],[8,-6],[10,5],[-10,2],[3,11]])rock(...p);
// Small pond
const pond=new THREE.Mesh(new THREE.BoxGeometry(5,.08,3),materials.water);pond.position.set(5,-.02,3);scene.add(pond);
// Original little village huts
function hut(x,z){const base=cube(x,.45,z,materials.sand,1.7,'decoration');base.scale.set(2.4,.9,2);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.5,4),materials.red);roof.position.set(x,1.55,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof);const door=cube(x,.35,z-1.02,materials.wood,.55,'decoration');door.scale.set(.55,.8,.12)}hut(-4,-2);hut(-7,1);
// Player
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.65,.9,.45),materials.blue);body.position.y=.85;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.58,.58,.58),materials.sand);head.position.y=1.58;head.castShadow=true;player.add(head);const eyeMat=mat(0x263b35);for(const x of [-.15,.15]){const e=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.04),eyeMat);e.position.set(x,1.65,-.3);player.add(e)}player.position.set(0,0,0);scene.add(player);
// Friendly original dragon companion
const dragon=new THREE.Group();const dBody=new THREE.Mesh(new THREE.BoxGeometry(.85,.55,.65),mat(0x70bd8c));dBody.position.y=.65;dragon.add(dBody);const dHead=new THREE.Mesh(new THREE.BoxGeometry(.48,.42,.48),mat(0x83d19e));dHead.position.set(0,1,-.28);dragon.add(dHead);const wingMat=mat(0x4f9d7b);for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.85),wingMat);wing.position.set(side*.52,.85,.05);wing.rotation.z=side*-.35;dragon.add(wing);const horn=new THREE.Mesh(new THREE.ConeGeometry(.09,.28,5),materials.gold);horn.position.set(side*.16,1.3,-.28);dragon.add(horn)}dragon.position.set(1,0,1);scene.add(dragon);
// A friendly villager marker
const villager=cube(2,.65,-5,materials.gold,.75,'decoration');
const saved=(()=>{try{return JSON.parse(localStorage.getItem('blockBuddySave')||'{}')}catch{return {}}})();
let inventory={wood:Number(saved.wood)||0,stone:Number(saved.stone)||0,stars:Number(saved.stars)||0};let built=[];let playerPos=saved.playerPos&&Array.isArray(saved.playerPos)?saved.playerPos:[0,0,0];player.position.set(...playerPos);let placed=Array.isArray(saved.placed)?saved.placed:[];
function save(){localStorage.setItem('blockBuddySave',JSON.stringify({wood:inventory.wood,stone:inventory.stone,stars:inventory.stars,playerPos:player.position.toArray(),placed}));}
function updateHUD(){for(const k of ['wood','stone','stars'])document.getElementById(k).textContent=inventory[k]}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1800)}
function showModal(title,content,buttons=[]){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=content;const box=document.getElementById('modalButtons');box.replaceChildren();for(const b of buttons){const el=document.createElement('button');el.textContent=b.label;el.className=b.primary?'primary':'';el.onclick=()=>{b.action();closeModal()};box.append(el)}document.getElementById('modalWrap').style.display='flex'}function closeModal(){document.getElementById('modalWrap').style.display='none'}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
function distance(a,b){return a.distanceTo(b)}
function collect(){let nearest=null,dist=3.2;for(const r of resources){if(!r.visible)continue;const d=distance(player.position,r.position);if(d<dist){dist=d;nearest=r}}if(!nearest){toast('Move closer to a tree or rock.');return}nearest.visible=false;inventory[nearest.userData.resource]+=1;updateHUD();save();toast(nearest.userData.resource==='wood'?'You collected wood!':'You collected stone!')}
function build(){const options=[{name:'Grass block',cost:1,type:'wood',material:materials.darkGrass},{name:'Stone block',cost:2,type:'stone',material:materials.stone},{name:'Golden block',cost:3,type:'wood',material:materials.gold}];showModal('Build something','Choose a block to place just in front of you. There is no wrong way to build.',options.map(o=>({label:`${o.name} (${o.cost} ${o.type})`,primary:o.name==='Grass block',action:()=>{if(inventory[o.type]<o.cost){toast(`You need ${o.cost} ${o.type}.`);return}inventory[o.type]-=o.cost;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);const x=Math.round(player.position.x+dir.x*2),z=Math.round(player.position.z+dir.z*2);const key=[x,0,z,o.name];if(placed.some(p=>p[0]===x&&p[2]===z)){toast('That spot is already built on.');inventory[o.type]+=o.cost;updateHUD();return}cube(x,.5,z,o.material,1,'block');placed.push(key);inventory.stars++;updateHUD();save();toast('Your new block is placed!')}})))}
function buddyTalk(){const lines=['I like exploring with you!','Your world is full of possibilities.','We can take a break whenever you want.','That was a lovely idea.','Would you like to build something together?'];showModal('Buddy the dragon',lines[Math.floor(Math.random()*lines.length)],[{label:'Give Buddy a pat',primary:true,action:()=>{inventory.stars++;updateHUD();save();toast('Buddy is happy! +1 star')}} ,{label:'Tell me a joke',action:()=>toast('Why did the dragon cross the block? To get to the other tile!')}])}
function quest(){showModal('A little adventure','The village path needs a bridge. Can you collect 3 wood and 2 stone? You can do it in your own time.',[{label:'I found the materials',primary:true,action:()=>{if(inventory.wood>=3&&inventory.stone>=2){inventory.wood-=3;inventory.stone-=2;inventory.stars+=5;updateHUD();save();toast('Quest complete! Five stars for you!')}else toast(`You have ${inventory.wood}/3 wood and ${inventory.stone}/2 stone.`)}},{label:'Maybe later',action:()=>{}}])}
function reset(){showModal('Start a fresh world?','This resets your saved blocks and collected materials on this device.',[{label:'Keep my world',primary:true,action:()=>{}},{label:'Start fresh',action:()=>{localStorage.removeItem('blockBuddySave');location.reload()}}])}
document.getElementById('collect').onclick=collect;document.getElementById('build').onclick=build;document.getElementById('buddy').onclick=buddyTalk;document.getElementById('quest').onclick=quest;document.getElementById('reset').onclick=reset;
// Restore placed blocks
for(const p of placed){const m=p[3]==='Stone block'?materials.stone:p[3]==='Golden block'?materials.gold:materials.darkGrass;cube(p[0],.5,p[2],m,1,'block')}
updateHUD();
const keys={forward:false,back:false,left:false,right:false};document.querySelectorAll('[data-move]').forEach(btn=>{const k=btn.dataset.move;const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,off))});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.forward=true;if(e.key==='ArrowDown'||e.key==='s')keys.back=true;if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '){e.preventDefault();collect()}});addEventListener('keyup',e=>{if(['ArrowUp','w'].includes(e.key))keys.forward=false;if(['ArrowDown','s'].includes(e.key))keys.back=false;if(['ArrowLeft','a'].includes(e.key))keys.left=false;if(['ArrowRight','d'].includes(e.key))keys.right=false});
// Drag to look around on touch or mouse
let dragging=false,lastX=0,lastY=0,yaw=0,pitch=-.22;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging||e.target.closest('button'))return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=Math.max(-.75,Math.min(.2,pitch+dy*.003))});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const speed=4.2;const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));const move=new THREE.Vector3();if(keys.forward)move.add(forward);if(keys.back)move.sub(forward);if(keys.right)move.add(right);if(keys.left)move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(speed*dt);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-15,15);player.position.z=THREE.MathUtils.clamp(player.position.z,-15,15);player.rotation.y=Math.atan2(move.x,move.z)}dragon.position.x=THREE.MathUtils.damp(dragon.position.x,player.position.x+Math.sin(clock.elapsedTime*1.8)*1.2,3,dt);dragon.position.z=THREE.MathUtils.damp(dragon.position.z,player.position.z+1.4+Math.cos(clock.elapsedTime*1.4)*.5,3,dt);dragon.position.y=.2+Math.sin(clock.elapsedTime*3)*.18;dragon.rotation.y=Math.sin(clock.elapsedTime)*.15;const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);const offset=new THREE.Vector3(0,4.2,7.5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(target.clone().add(offset),.08);camera.lookAt(target.x,target.y+pitch*3,target.z);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('beforeunload',save);
</script>
</body></html>
