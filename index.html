}.actionbar button{font-size:12px}.controls button:active,.actionbar button:active,.btn:active{background:#52745c}.modal-wrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:10;overflow:auto}.modal{width:min(540px,100%);max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 60px #0008}.modal h2{margin:0 38px 7px 0;font-size:22px}.modal p{color:var(--muted);line-height:1.5;margin:8px 0}.modal .close{float:right;border:0;background:#ffffff18;color:white;border-radius:10px;padding:7px 10px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);border-radius:12px;background:#29463a;color:var(--ink);padding:11px 13px;text-align:left;flex:1 1 145px;min-height:44px}.btn.primary{background:#52745c}.btn.soft{background:#344a63}.btn.gold{background:#725d2e}.muted{color:var(--muted);font-size:12px}.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.choice{border:1px solid var(--line);background:#29463a;border-radius:14px;padding:12px;text-align:left;color:var(--ink);min-height:84px}.choice.selected{outline:2px solid var(--accent);background:#3b5745}.choice b{display:block;margin-bottom:4px}.choice span{font-size:12px;color:var(--muted)}.bar{height:8px;border-radius:10px;background:#ffffff1c;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--green);width:0}.toast{position:fixed;left:50%;top:82px;transform:translateX(-50%);background:#14251fee;border:1px solid var(--line);border-radius:20px;padding:9px 14px;display:none;z-index:20;font-size:13px;max-width:90%;text-align:center}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.tab{border:1px solid var(--line);background:#ffffff10;color:var(--ink);border-radius:20px;padding:8px 12px;white-space:nowrap;font-size:13px}.tab.active{background:#52745c}.activity{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:#ffffff08}.activity h3{margin:0 0 4px;font-size:16px}.activity p{margin:4px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{background:#ffffff0b;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--ink)}.tool strong{display:block;margin:4px 0}.tool small{color:var(--muted)}.footer{border-top:1px solid var(--line);margin-top:14px;padding-top:10px;color:var(--muted);font-size:11px;line-height:1.4}@media(min-width:760px){.controls{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px)}.actionbar{max-width:360px}.actionbar button{font-size:13px}.hint{font-size:13px;max-width:320px}}@media(max-width:420px){.stats .pill:nth-child(3){display:none}.brand strong{font-size:15px}.actionbar{max-width:165px}.actionbar button{padding:7px 8px;font-size:11px}.hint{max-width:150px}.modal{padding:15px}.cardgrid,.toolbox{grid-template-columns:1fr 1fr}}

<body>
<div id="loading"><div class="loadcard"><strong>🐉 Loading Block Buddy…</strong><small>Getting your world ready. This can take a moment.</small></div></div><div id="game"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="hud"><div class="top"><div class="brand"><strong>🐉 Block Buddy</strong><small>Your world. Your way.</small></div><div class="stats"><span class="pill">🪵 <b id="wood">0</b></span><span class="pill">🪨 <b id="stone">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div></div><div class="bottom"><div class="hint panel" id="hint">Explore at your own pace. Your world will be here when you return.</div><div style="display:flex;gap:8px;align-items:end"><div class="controls" aria-label="Movement"><button class="up" data-move="forward" aria-label="Move forward">▲</button><button class="left" data-move="left" aria-label="Move left">◀</button><button class="down" data-move="back" aria-label="Move back">▼</button><button class="right" data-move="right" aria-label="Move right">▶</button></div><div class="actionbar"><button id="collect">Collect</button><button id="build">Build</button><button id="toolboxBtn">Toolbox</button><button id="adventuresBtn">Adventures</button><button id="menuBtn">Menu</button></div></div></div></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">✕</button><h2 id="modalTitle">Block Buddy</h2><div id="modalBody"></div><div class="btnrow" id="modalButtons"></div></div></div>
<script type="module">
try {
const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const $=id=>document.getElementById(id), root=$('game');
$('loading').style.display='none';
const SAVE_KEY='blockBuddy_v2_save';
const defaults={wood:0,stone:0,stars:0,character:'blue',dragon:'buddy',player:[0,0,0],built:[],completed:[],visited:[],toolbox:[],settings:{quiet:false,motion:true,voice:false}};
let state;try{const current=localStorage.getItem(SAVE_KEY);if(current){state={...defaults,...JSON.parse(current)}}else{const old=JSON.parse(localStorage.getItem('blockBuddySave')||'{}');const migratedBuilt=Array.isArray(old.placed)?old.placed.map(p=>({x:Number(p[0])||0,z:Number(p[2])||0,type:p[3]==='Stone block'?'stone':p[3]==='Golden block'?'gold':'dark'})):[];state={...defaults,wood:Number(old.wood)||0,stone:Number(old.stone)||0,stars:Number(old.stars)||0,player:Array.isArray(old.playerPos)?old.playerPos:[0,0,0],built:migratedBuilt}}state.settings={...defaults.settings,...(state.settings||{})}}catch{state={...defaults}}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){toast('This browser could not save just now. You can keep playing.')}};
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function updateHUD(){$('wood').textContent=state.wood;$('stone').textContent=state.stone;$('stars').textContent=state.stars}
function openModal(title,html,buttons=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalButtons').replaceChildren();for(const b of buttons){const el=document.createElement('button');el.className='btn '+(b.className||'');el.textContent=b.label;el.onclick=()=>{if(b.action)b.action();if(b.close!==false)closeModal()};$('modalButtons').append(el)}$('modalWrap').style.display='flex'}
function closeModal(){$('modalWrap').style.display='none'}$('closeModal').onclick=closeModal;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
// ----- Three-dimensional original block world -----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8d4);scene.fog=new THREE.Fog(0x9bc8d4,23,58);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x647b4b,2));const sun=new THREE.DirectionalLight(0xfff0ce,2);sun.position.set(9,17,8);sun.castShadow=true;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.95});const mats={grass:material(0x75a85e),dark:material(0x5f914d),wood:material(0x93613d),leaf:material(0x438653),stone:material(0x858e91),water:material(0x4b9dbb),sand:material(0xd6c18b),gold:material(0xf2c66d),roof:material(0xa65d4c),flower:material(0xf4c9dd),purple:material(0x9679c8),blue:material(0x4d91c5),skin:material(0xf1c7a1),white:material(0xf3ead1)};
const ground=new THREE.Mesh(new THREE.BoxGeometry(38,1,38),mats.grass);ground.position.y=-.55;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(38,38,0x426c43,0x68915c);grid.position.y=-.045;scene.add(grid);
const resources=[];const builtMeshes=[];function box(x,y,z,mat,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z){box(x,.5,z,mats.wood,.55,1.4,.55);box(x,1.65,z,mats.leaf,1.7,1.5,1.7);box(x,2.45,z,mats.leaf,1.1,1.1,1.1);const r=box(x+.65,.2,z,mats.wood,.48,.32,.48);r.userData.resource='wood';resources.push(r)}
function rock(x,z){const r=box(x,.25,z,mats.stone,.9,.7,.8);r.userData.resource='stone';resources.push(r)}
for(let x=-16;x<=16;x+=4){tree(x,-15);tree(x,15)}for(let z=-11;z<=11;z+=4){tree(-16,z);tree(16,z)}for(const p of [[-8,-6],[-6,8],[9,-7],[11,6],[-11,2],[3,12],[12,-1]])rock(...p);
// Pond, paths, village, cave and garden details
const pond=box(5,-.02,4,mats.water,5,.08,3.8);for(let i=-3;i<=3;i++){box(i*.8,-.01,-1,mats.sand,.65,.06,.65)}
function hut(x,z){box(x,.4,z,mats.sand,2.5,.9,2);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.9,1.35,4),mats.roof);roof.position.set(x,1.45,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof);box(x,.25,z-1.05,mats.wood,.6,.8,.12);box(x,.75,z-1.08,mats.gold,.18,.18,.04)}hut(-5,-4);hut(-8,0);hut(7,-8);
for(let i=0;i<20;i++){const x=-10+Math.random()*20,z=-10+Math.random()*20;if(Math.abs(x-5)>4||Math.abs(z-4)>3){const f=box(x,.12,z,i%2?mats.flower:mats.gold,.12,.24,.12);f.rotation.z=.25}}
// Mushroom grove
for(const [x,z] of [[-10,-9],[-8,-10],[-11,-7]]){box(x,.25,z,mats.white,.18,.5,.18);box(x,.58,z,mats.roof,.7,.2,.7)}
// crystal cave entrance
box(12,.65,10,mats.stone,2.8,1.3,1);box(12,1.3,10,mats.stone,2,.7,1);box(12,.6,9.45,material(0x253b4a),1.3,1.1,.08);
// floating lookout island silhouette
const island=box(-2,4,13,mats.sand,4,.7,3);box(-2,4.65,13,mats.grass,3.8,.25,2.8);for(let i=0;i<3;i++)box(-3+i,5.2,13,mats.leaf,.8,.9,.8);
// Character selection - two original blonde boys
const player=new THREE.Group();scene.add(player);function makeCharacter(shirt){player.clear();const torso=new THREE.Mesh(new THREE.BoxGeometry(.68,.9,.42),shirt==='purple'?mats.purple:mats.blue);torso.position.y=.82;torso.castShadow=true;player.add(torso);const head=new THREE.Mesh(new THREE.BoxGeometry(.58,.58,.58),mats.skin);head.position.y=1.55;head.castShadow=true;player.add(head);const hair=new THREE.Mesh(new THREE.BoxGeometry(.62,.2,.62),material(0xe8c45d));hair.position.set(0,1.87,0);player.add(hair);for(const x of [-.15,.15]){const eye=box(0,0,0,material(0x263b35),.07,.07,.04);eye.position.set(x,1.58,-.3);player.add(eye)}const legmat=material(0x34485a);for(const x of [-.19,.19]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.48,.25),legmat);leg.position.set(x,.24,0);player.add(leg)}}makeCharacter(state.character);player.position.set(...(Array.isArray(state.player)?state.player:[0,0,0]));
// Four original dragon companions
const dragon=new THREE.Group();scene.add(dragon);const dragonDefs={buddy:{name:'Buddy',color:0x70bd8c,wing:0x4f9d7b,description:'A gentle, encouraging friend.'},ember:{name:'Ember',color:0xe8895f,wing:0xc65e48,description:'Brave and good at trying a new plan.'},sparky:{name:'Sparky',color:0xe7c75e,wing:0xb58c38,description:'Curious and loves puzzles.'},blaze:{name:'Blaze',color:0x9679c8,wing:0x7055a8,description:'Confident and remembers boundaries.'}};
function makeDragon(key){dragon.clear();const d=dragonDefs[key]||dragonDefs.buddy;const body=new THREE.Mesh(new THREE.BoxGeometry(.85,.55,.7),material(d.color));body.position.y=.62;dragon.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.42,.48),material(d.color));head.position.set(0,.98,-.32);dragon.add(head);for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,.85),material(d.wing));wing.position.set(side*.52,.85,.05);wing.rotation.z=side*-.35;dragon.add(wing);const horn=new THREE.Mesh(new THREE.ConeGeometry(.09,.28,5),mats.gold);horn.position.set(side*.16,1.3,-.3);dragon.add(horn)}dragon.position.set(1,0,1)}makeDragon(state.dragon);
// Restore built blocks
for(const b of (state.built||[])){const m=box(b.x,.5,b.z,mats[b.type]||mats.dark,1,1,1);builtMeshes.push(m)}
// Movement is world-relative and explicitly maps left to -X, right to +X, up to -Z, down to +Z.
const held={forward:false,back:false,left:false,right:false};let yaw=0,pitch=-.2;const keys={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
function bindHold(el,key){const on=e=>{e.preventDefault();held[key]=true};const off=e=>{e.preventDefault();held[key]=false};el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,off))}document.querySelectorAll('[data-move]').forEach(el=>bindHold(el,el.dataset.move));addEventListener('keydown',e=>{const k=keys[e.key];if(k){e.preventDefault();held[k]=true}});addEventListener('keyup',e=>{const k=keys[e.key];if(k)held[k]=false});
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.0035;pitch=THREE.MathUtils.clamp(pitch+dy*.002,-.6,.15)});
function collect(){let found=null,best=3.2;for(const r of resources){if(!r.visible)continue;const d=player.position.distanceTo(r.position);if(d<best){best=d;found=r}}if(!found){toast('Move closer to a tree or rock to collect nearby materials.');return}found.visible=false;state[found.userData.resource]++;state.stars++;updateHUD();save();toast(found.userData.resource==='wood'?'Wood collected. Nice exploring!':'Stone collected. Nice exploring!')}
function build(){const html='<p>Choose a block for your world. Building is creative play; there is no wrong design.</p><div class="cardgrid"><button class="choice" data-build="dark"><b>🌱 Meadow block</b><span>Costs 1 wood</span></button><button class="choice" data-build="stone"><b>🪨 Stone block</b><span>Costs 2 stone</span></button><button class="choice" data-build="gold"><b>⭐ Golden block</b><span>Costs 3 wood</span></button></div>';openModal('Builder’s Workshop',html);document.querySelectorAll('[data-build]').forEach(el=>el.onclick=()=>{const type=el.dataset.build,cost=type==='stone'?2:type==='gold'?3:1,resource=type==='stone'?'stone':'wood';if(state[resource]<cost){toast(`You need ${cost} ${resource}. You can explore and collect more, or build later.`);return}state[resource]-=cost;const dir=new THREE.Vector3(0,0,-2).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const x=Math.round(player.position.x+dir.x),z=Math.round(player.position.z+dir.z);if(state.built.some(b=>b.x===x&&b.z===z)){state[resource]+=cost;toast('That space is already occupied. Try another spot.');updateHUD();return}state.built.push({x,z,type});builtMeshes.push(box(x,.5,z,mats[type],1,1,1));state.stars++;updateHUD();save();closeModal();toast('Your block is part of the world now!')})}
// Accessible scenario engine: multiple valid choices, no right/wrong score, no penalty.
const scenarios=[
{id:'tower',title:'The Great Wobbly Tower',area:'Frustration & flexibility',dragon:'Ember',intro:'You and Ember build a tall tower. A sudden gust makes some blocks tumble down. Ember looks disappointed.',prompt:'What could you try next?',choices:[['Try building it again, perhaps a little differently.','Trying a new plan is one option.'],['Ask Ember to help.','Asking for help is a useful tool.'],['Take a break in the Calm Garden.','A pause is allowed. You can return later if you want.'],['Build something completely different.','Changing the plan can be creative too.'],['I have another idea.','Your own ideas belong in this adventure.']],skill:'Noticing disappointment, choosing a next step, flexible thinking and asking for support.'},
{id:'picnic',title:'The Friendship Picnic',area:'Friendship & negotiation',dragon:'Buddy',intro:'Buddy invites two villagers to a picnic. One wants to hunt for treasure; another wants to build a racetrack. They have different ideas.',prompt:'What might help everyone decide what to do?',choices:[['Suggest taking turns choosing.','Taking turns is one possible agreement.'],['Ask if there is an activity they both like.','Finding a shared idea can help.'],['Do one activity now and another later.','A plan can include more than one idea.'],['Choose a different activity for myself.','It is okay to enjoy a different activity.'],['I have another idea.','You can make your own suggestion.']],skill:'Negotiating, listening to preferences, expressing ideas and accepting differences.'},
{id:'space',title:'Sparky Needs Some Space',area:'Boundaries & consent',dragon:'Sparky',intro:'Sparky is resting in a quiet place. A villager comes over and wants to play. Sparky says, “I want some space right now.”',prompt:'What could the villager do?',choices:[['Give Sparky room.','Respecting a request for space matters.'],['Ask if Sparky would like to play later.','A later invitation leaves the choice with Sparky.'],['Find another activity for now.','There are many ways to spend time.'],['Ask what Sparky would prefer.','Checking what someone wants can be helpful.']],skill:'Recognising boundaries, respecting no, consent and other people’s choices.'},
{id:'path',title:'The Unexpected Path',area:'Change & problem-solving',dragon:'Blaze',intro:'You planned to visit Crystal Cave, but a fallen tree blocks the usual path. The cave is still there, but the route has changed.',prompt:'What would you like to do?',choices:[['Look for another path.','Exploring alternatives is problem-solving.'],['Ask Blaze to help make a plan.','You can ask someone to work it out with you.'],['Visit somewhere else today.','Changing the destination is a valid choice.'],['Pause and decide later.','You do not have to decide immediately.']],skill:'Handling unexpected changes, planning alternatives and self-advocacy.'},
{id:'no',title:'A Friendly “No Thanks”',area:'Rejection & resilience',dragon:'Buddy',intro:'You invite a villager to play. They say, “No thanks. I want to play by myself.”',prompt:'What could you do next?',choices:[['Say “Okay” and choose something else.','A no can be respected without ending the possibility of friendship.'],['Ask if they might want to play another time.','You can ask once and leave the choice with them.'],['Find another person or activity.','There are other ways to have a good time.'],['Take a moment if I feel disappointed.','It is okay to feel disappointed. Feelings do not need to disappear instantly.']],skill:'Handling rejection, respecting another person’s choice and finding support.'},
{id:'belongings',title:'The Missing Building Blocks',area:'Belongings & asking',dragon:'Sparky',intro:'A villager picks up a special block from your building area without asking. You wanted to use it.',prompt:'What could you say or do?',choices:[['“Please ask before taking my things.”','You can set a clear boundary.'],['“I was using that. Can I have it back?”','A clear request explains what you need.'],['Ask a trusted character to help.','Getting help is a useful option.'],['Offer to find a way to take turns, if I want to.','Taking turns is an option, not an obligation.']],skill:'Communicating needs, ownership, assertive requests and asking for help.'},
{id:'misunderstanding',title:'The Mixed-Up Message',area:'Communication',dragon:'Ember',intro:'A villager misunderstands your building idea and starts building something different. Nobody is in trouble; the message just got mixed up.',prompt:'How could you help them understand?',choices:[['Show them with blocks.','Pictures, gestures and demonstrations are communication too.'],['Explain the idea in another way.','Trying different words can help.'],['Ask them what they understood.','Checking understanding can clear things up.'],['Ask for a pause and try again later.','You can pause a conversation.']],skill:'Clarifying, checking understanding and using different ways to communicate.'},
{id:'team',title:'The Bridge Builders',area:'Cooperation & planning',dragon:'Blaze',intro:'A bridge needs to cross a stream. You have one idea, and a villager has another. You can build together, separately or change the plan.',prompt:'What sounds good to you?',choices:[['Plan the bridge together.','Working together can combine ideas.'],['Build two small designs and compare them.','Trying ideas can help decide.'],['Ask what matters most to each builder.','Understanding priorities can help.'],['Build my own bridge nearby.','Cooperation does not mean giving up your own idea.']],skill:'Planning, cooperation, compromise and independent choice.'}
];
function scenarioDone(id){if(!state.completed.includes(id)){state.completed.push(id);state.stars+=2;updateHUD();save()}}
function runScenario(id){const s=scenarios.find(x=>x.id===id);if(!s)return;const choices=s.choices.map((c,i)=>`<button class="btn" data-choice="${i}">${c[0]}</button>`).join('');openModal(s.title,`<p class="muted">${s.area} · ${s.dragon}</p><p>${s.intro}</p><p><b>${s.prompt}</b></p><div class="btnrow" style="display:grid;grid-template-columns:1fr">${choices}</div><p class="muted">There is no test and no bad answer. Pick an idea, or close the adventure and return later.</p>`);document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{const c=s.choices[Number(el.dataset.choice)];scenarioDone(id);openModal('A possibility to explore',`<p>${c[1]}</p><p><b>Skill this adventure offers practice with:</b> ${s.skill}</p><p>You can try another choice, replay this adventure or explore somewhere else.</p>`,[{label:'Try another choice',className:'primary',action:()=>runScenario(id)},{label:'Back to adventures',action:()=>showAdventures()},{label:'Finish for now',action:()=>{}}])})}
function showAdventures(){const cards=scenarios.map(s=>`<button class="choice" data-scenario="${s.id}"><b>${s.title}</b><span>${s.area}${state.completed.includes(s.id)?' · ★ explored':''}</span></button>`).join('');openModal('Adventure Journal',`<p>Choose any story. You can repeat an adventure, skip one or leave whenever you like. The star means you explored it, not that you passed a test.</p><div class="cardgrid">${cards}</div>`);document.querySelectorAll('[data-scenario]').forEach(el=>el.onclick=()=>runScenario(el.dataset.scenario))}
function showToolbox(){const tools=[['🌿','I need a break','Find a quiet place or pause the game.','break'],['🙋','I need help','Practise asking a person or dragon for help.','help'],['😤','I feel frustrated','Notice the feeling and choose what might help.','frustrated'],['🗣️','I need to say something','Try words for a need, boundary or request.','speak'],['🔄','Plans changed','Explore another option or ask for more information.','change'],['🧘','Help my body feel settled','Try a gentle breathing or sensory choice.','calm'],['🛑','I want something to stop','Practise clear words and getting trusted adult help.','stop'],['💡','I have an idea','Save a personal strategy that works for you.','idea']];const html='<p>Your toolbox is always available. Pick a tool that feels useful, or close this window. You do not have to use any of them.</p><div class="toolbox">'+tools.map(t=>`<button class="tool" data-tool="${t[3]}"><span style="font-size:23px">${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small></button>`).join('')+'</div><div class="footer">A tool is an option, not an instruction. If something feels unsafe, uncomfortable or too much, it is okay to move away and ask a trusted adult for help.</div>';openModal('My Dragon Toolbox',html);document.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>toolDetail(el.dataset.tool))}
function toolDetail(id){const data={break:['Taking a break','You can pause, sit somewhere quiet, stretch, get a drink or do something you enjoy. You do not lose progress by taking a break.',['Quiet garden','Stretch','Drink of water','Return later']],help:['Asking for help','Try a phrase, show a picture, point to the help button or ask a trusted person to come over.',['Can you help me?','I’m not sure what to do.','Can you show me?']],frustrated:['When I feel frustrated','Frustration can be a signal that something is hard, unexpected or not working. You do not have to make the feeling vanish.',['Pause for a moment','Try a different plan','Ask for help','Move to a calmer place']],speak:['Words I can use','You can say these, type them, point to them or choose a picture.',['Please stop.','I need some space.','I don’t like that.','Can you explain?','I need help.']],change:['When plans change','You can ask what changed, find out what happens next, choose another plan or take time to think.',['What changed?','What happens next?','Show me my choices.','I need a minute.']],calm:['Help my body feel settled','Different things help different people. Choose what feels comfortable. You can skip all of these.',['Slow gentle breaths','Listen to a quiet sound','Look at a familiar picture','Rock or move gently','Find a quieter space']],stop:['When I want something to stop','Your body and belongings matter. You can use a clear stop message and move away. If someone does not respect it or you feel unsafe, tell a trusted adult.',['Stop, please.','I don’t want that.','Move back, please.','I’m getting a trusted adult.']],idea:['My own helpful idea','What helps you when something feels tricky? You can choose a strategy to remember.',['Build something else','Talk to someone I trust','Take a quiet break','Use my own words']]};const d=data[id];const html=`<p>${d[1]}</p><div class="btnrow" style="display:grid;grid-template-columns:1fr">${d[2].map(x=>`<button class="btn" data-phrase="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}</div><p class="muted">Choose one to save it to your personal toolbox, or just explore it without saving.</p>`;openModal(d[0],html);document.querySelectorAll('[data-phrase]').forEach(el=>el.onclick=()=>{const p=el.dataset.phrase;if(!state.toolbox.includes(p)){state.toolbox.push(p);save()}toast('Added to My Toolbox.');openModal('Saved to My Toolbox',`<p>“${p}” is in your toolbox. You can use it in the game whenever you want.</p>`,[{label:'Back to toolbox',className:'primary',action:showToolbox}])})}
function showParentCorner(){const explored=scenarios.filter(s=>state.completed.includes(s.id));const tools=state.toolbox.length?state.toolbox.map(x=>`<li>${x}</li>`).join(''):'<li>No personal strategies saved yet.</li>';const rows=scenarios.map(s=>`<li>${s.title}: ${state.completed.includes(s.id)?'Explored':'Not explored yet'}</li>`).join('');openModal('Parent Corner',`<p>This private-on-device overview is for noticing what your child chooses to explore. It is not a behaviour score, developmental assessment or measure of progress.</p><div class="activity"><h3>Adventure journal</h3><p>${explored.length} of ${scenarios.length} adventures explored</p><div class="bar"><i style="width:${Math.round(explored.length/scenarios.length*100)}%"></i></div><ul>${rows}</ul></div><div class="activity"><h3>Strategies saved in My Toolbox</h3><ul>${tools}</ul></div><div class="activity"><h3>Ideas for supporting play</h3><ul><li>Follow his interests and let him choose the activity.</li><li>Accept speech, pointing, typing, pictures or in-game actions.</li><li>Talk about a scenario only if he wants to; don't quiz him afterwards.</li><li>Notice which options he returns to and offer those tools in real life when appropriate.</li><li>If a scenario feels uncomfortable, skip it or adapt it together.</li></ul></div><p class="muted">All progress is stored in this browser on this device. Export a backup if you want to keep it. Block Buddy is an enjoyable practice environment, not therapy or a diagnostic tool.</p>`,[{label:'Back to world settings',className:'primary',action:showMenu}])}
function showMenu(){openModal('Your Block Buddy world',`<p>Choose your character, dragon companion or world settings. Your choices are saved on this device.</p><div class="activity"><h3>Choose your character</h3><div class="cardgrid"><button class="choice ${state.character==='blue'?'selected':''}" data-character="blue"><b>👦 Blue shirt</b><span>Blonde boy adventurer</span></button><button class="choice ${state.character==='purple'?'selected':''}" data-character="purple"><b>👦 Purple shirt</b><span>Blonde boy adventurer</span></button></div></div><div class="activity"><h3>Choose your dragon</h3><div class="cardgrid">${Object.entries(dragonDefs).map(([k,d])=>`<button class="choice ${state.dragon===k?'selected':''}" data-dragon="${k}"><b>🐉 ${d.name}</b><span>${d.description}</span></button>`).join('')}</div></div><div class="activity"><h3>Comfort settings</h3><p class="muted">Turn down movement effects or hide optional prompts.</p><button class="btn" id="motionToggle">Reduced movement: ${state.settings.motion?'Off':'On'}</button><button class="btn" id="quietToggle">Quiet prompts: ${state.settings.quiet?'On':'Off'}</button></div><div class="activity"><h3>Progress</h3><p>${state.completed.length} adventures explored · ${state.toolbox.length} personal tools saved · ${state.built.length} blocks built</p><button class="btn" id="parentCorner">Open Parent Corner</button><button class="btn" id="exportSave">Export my world save</button><button class="btn" id="importSave">Import a world save</button><input type="file" id="saveFile" accept="application/json" hidden></div><div class="footer">Progress is stored in this browser on this device. Export a backup before clearing browser data or changing devices. This game is a play and practice tool, not a medical treatment or a replacement for professional support.</div>`);document.querySelectorAll('[data-character]').forEach(el=>el.onclick=()=>{state.character=el.dataset.character;makeCharacter(state.character);save();showMenu()});document.querySelectorAll('[data-dragon]').forEach(el=>el.onclick=()=>{state.dragon=el.dataset.dragon;makeDragon(state.dragon);save();showMenu()});$('motionToggle').onclick=()=>{state.settings.motion=!state.settings.motion;save();showMenu()};$('quietToggle').onclick=()=>{state.settings.quiet=!state.settings.quiet;save();showMenu()};$('parentCorner').onclick=showParentCorner;$('exportSave').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='block-buddy-save.json';a.click();URL.revokeObjectURL(a.href)};$('importSave').onclick=()=>$('saveFile').click();$('saveFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());state={...defaults,...d,settings:{...defaults.settings,...(d.settings||{})}};save();location.reload()}catch{toast('That save file could not be read.')}}}
// Build/collect and buttons
$('collect').onclick=collect;$('build').onclick=build;$('toolboxBtn').onclick=showToolbox;$('adventuresBtn').onclick=showAdventures;$('menuBtn').onclick=showMenu;
// Friendly optional dragon greeting, no speech required
function dragonHello(){const d=dragonDefs[state.dragon];openModal(`${d.name} says hello!`,`I’m glad we’re exploring together. We can build, try an adventure, use the toolbox or just wander. You choose.`,[{label:'Explore together',className:'primary',action:()=>closeModal()},{label:'Open my toolbox',action:showToolbox}])}
// Simple quest / story prompt available through village interaction (also via adventures menu)
$('hint').textContent=state.settings.quiet?'Explore at your own pace.':'Your world is ready. Try the Toolbox whenever you want a break, help or words to use.';
updateHUD();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const speed=4.2;const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const move=new THREE.Vector3();if(held.forward)move.add(forward);if(held.back)move.sub(forward);if(held.right)move.add(right);if(held.left)move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(speed*dt);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);player.rotation.y=Math.atan2(-move.x,-move.z)}const t=clock.elapsedTime;dragon.position.x=THREE.MathUtils.damp(dragon.position.x,player.position.x+Math.sin(t*1.7)*1.05,3,dt);dragon.position.z=THREE.MathUtils.damp(dragon.position.z,player.position.z+1.3+Math.cos(t*1.3)*.4,3,dt);dragon.position.y=state.settings.motion ? 0.2+Math.sin(t*2.5)*0.13 : 0.15;dragon.rotation.y=Math.sin(t)*.12;const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);const offset=new THREE.Vector3(0,4.6,7.8).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(target.clone().add(offset),.09);camera.lookAt(target.x,target.y+pitch*2,target.z);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setInterval(save,4000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('beforeunload',save);updateHUD();
} catch (error) {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.style.display = 'flex';
    loading.innerHTML = '<div class="loadcard"><strong>Block Buddy could not load yet.</strong><small>Please check that this device is connected to the internet, then refresh the page. The 3D world engine loads from a secure external library. Your saved world is not being deleted.</small></div>';
  }
  console.error('Block Buddy startup error:', error);
}
