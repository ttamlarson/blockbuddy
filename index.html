<body>
<div id="loading"><div class="loadcard"><strong>🐉 Loading Block Buddy…</strong><small>Getting your world ready. This can take a moment.</small></div></div><div id="game"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="hud"><div class="top"><div class="brand"><strong>🐉 BLOCK BUDDY</strong><small>Portal Realms · Explore, build & discover</small></div><div class="stats"><span class="pill">🪵 <b id="wood">0</b></span><span class="pill">🪨 <b id="stone">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div></div><div class="bottom"><div class="hint panel" id="hint">Walk into a glowing portal to discover mini-games. Explore at your own pace.</div><div style="display:flex;gap:8px;align-items:end"><div class="touch-control" aria-label="Touch movement joystick"><div id="joyPad" class="joy-pad" role="application" aria-label="Drag the thumb pad to move"><div class="joy-ring"></div><div id="joyKnob" class="joy-knob"></div></div><span class="joy-label">DRAG TO EXPLORE</span></div><div class="actionbar"><button id="collect">⛏ Collect</button><button id="build">🧱 Build</button><button id="toolboxBtn">🐉 Toolbox</button><button id="adventuresBtn">🗺 Adventures</button><button id="menuBtn">⚙ Menu</button></div></div></div></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">✕</button><h2 id="modalTitle">Block Buddy</h2><div id="modalBody"></div><div class="btnrow" id="modalButtons"></div></div></div>
<script type="module">
try {
let THREE;try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}catch(firstError){THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}
const $=id=>document.getElementById(id), root=$('game');
$('loading').style.display='none';
const SAVE_KEY='blockBuddy_v2_save';
const defaults={wood:0,stone:0,stars:0,collected:[],character:'blue',dragon:'buddy',player:[0,0,0],built:[],completed:[],visited:[],toolbox:[],roomDecor:[],settings:{quiet:false,motion:true,voice:false,openEnded:false,largeText:false}};
let state;try{const current=localStorage.getItem(SAVE_KEY);if(current){state={...defaults,...JSON.parse(current)}}else{const old=JSON.parse(localStorage.getItem('blockBuddySave')||'{}');const migratedBuilt=Array.isArray(old.placed)?old.placed.map(p=>({x:Number(p[0])||0,z:Number(p[2])||0,type:p[3]==='Stone block'?'stone':p[3]==='Golden block'?'gold':'dark'})):[];state={...defaults,wood:Number(old.wood)||0,stone:Number(old.stone)||0,stars:Number(old.stars)||0,player:Array.isArray(old.playerPos)?old.playerPos:[0,0,0],built:migratedBuilt}}state.settings={...defaults.settings,...(state.settings||{})}}catch{state={...defaults}}
document.body.classList.toggle('large-text',!!state.settings.largeText);
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){toast('This browser could not save just now. You can keep playing.')}};
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function updateHUD(){$('wood').textContent=state.wood;$('stone').textContent=state.stone;$('stars').textContent=state.stars}
function openModal(title,html,buttons=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalButtons').replaceChildren();for(const b of buttons){const el=document.createElement('button');el.className='btn '+(b.className||'');el.textContent=b.label;el.onclick=()=>{if(b.action)b.action();if(b.close!==false)closeModal()};$('modalButtons').append(el)}$('modalWrap').style.display='flex'}
function closeModal(){$('modalWrap').style.display='none';Object.keys(held).forEach(k=>held[k]=false)}$('closeModal').onclick=closeModal;$('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
// ----- Original voxel-fantasy adventure world with floating realms and magical portals -----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9ed);scene.fog=new THREE.Fog(0x8bc9ed,38,92);
const aspect=innerWidth/innerHeight;const camera=new THREE.OrthographicCamera(-12*aspect,12*aspect,12,-12,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf4fbff,0x81936a,2.15));const sun=new THREE.DirectionalLight(0xfff0cf,2.6);sun.position.set(-9,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=c=>new THREE.MeshToonMaterial({color:c});const mats={grass:material(0x79bd63),dark:material(0x5f9d50),wood:material(0x9b6846),leaf:material(0x438c52),stone:material(0x8795a8),water:material(0x55bad4),sand:material(0xf0d99a),gold:material(0xffca5e),roof:material(0xe77d65),flower:material(0xf6a7c8),purple:material(0x9a79d4),blue:material(0x55a9df),skin:material(0xffd1ad),white:material(0xfff3d8)};
const ground=new THREE.Mesh(new THREE.CircleGeometry(27,64),mats.grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.53;ground.receiveShadow=true;scene.add(ground);
// Soft rolling hills frame the play space.
for(const [x,z,sx,sz,c] of [[-18,-12,8,5,0x77bd76],[18,-15,9,6,0x8acb7a],[-19,13,9,7,0x8acb7a],[18,15,10,7,0x75b66e]]){const h=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material(c));h.scale.set(sx,2.1,sz);h.position.set(x,-.1,z);scene.add(h)}
const resources=[];const builtMeshes=[];
function box(x,y,z,mat,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function sphere(x,y,z,mat,sx=1,sy=1,sz=1,segments=18){const m=new THREE.Mesh(new THREE.SphereGeometry(1,segments,14),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z){box(x,.72,z,mats.wood,.48,1.55,.48);box(x,1.72,z,mats.leaf,1.45,1.05,1.35);box(x-.42,1.48,z+.04,mats.leaf,.72,.72,.78);box(x+.42,1.48,z-.04,mats.leaf,.72,.72,.78);box(x,2.28,z,mats.leaf,.82,.72,.82);const pickup=box(x+.7,.18,z+.45,mats.gold,.34,.34,.34);pickup.userData.resource='wood';pickup.userData.id='wood:'+x+','+z;pickup.visible=!(state.collected||[]).includes(pickup.userData.id);resources.push(pickup)}
function rock(x,z){const r=box(x,.28,z,mats.stone,.92,.58,.82);r.userData.resource='stone';r.userData.id='stone:'+x+','+z;r.visible=!(state.collected||[]).includes(r.userData.id);resources.push(r)}
for(let x=-16;x<=16;x+=4){tree(x,-15);tree(x,15)}for(let z=-11;z<=11;z+=4){tree(-16,z);tree(16,z)}for(const p of [[-8,-6],[-6,8],[9,-7],[11,6],[-11,2],[3,12],[12,-1]])rock(...p);
// Pond with a sandy shore and a little wooden jetty.
const pond=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,.12,48),mats.water);pond.rotation.x=0;pond.scale.z=.72;pond.position.set(5,-.04,4);scene.add(pond);const shore=new THREE.Mesh(new THREE.TorusGeometry(2.45,.18,8,48),mats.sand);shore.rotation.x=Math.PI/2;shore.scale.z=.72;shore.position.set(5,.01,4);scene.add(shore);for(let i=0;i<3;i++){const lily=sphere(4+i*.8,.06,3.6+(i%2)*.7,material(0x6eae68),.34,.045,.25);}
const jetty=box(2,.08,4,mats.wood,1.6,.16,.65);for(let i=0;i<3;i++)box(1.35+i*.65,-.18,4,mats.wood,.12,.5,.12);
function hut(x,z){box(x,.72,z,mats.sand,2.5,1.45,2.2);box(x,.05,z-1.13,mats.wood,.58,1.05,.14);box(x-.7,.95,z-1.16,mats.blue,.42,.42,.12);box(x+.7,.95,z-1.16,mats.blue,.42,.42,.12);for(let i=-1;i<=1;i++){box(x+i*.72,1.72,z,mats.roof,.82,.42,2.65);box(x,1.72,z+i*.72,mats.roof,2.65,.42,.82)}box(x,2.05,z,mats.gold,.28,.25,.28)}hut(-5,-4);hut(-8,0);hut(7,-8);

function playMiniGame(id,step=0,history=[]){if(id==='tower'){playTowerPuzzle();return;}const s=scenarios.find(x=>x.id===id),g=miniGames[id];if(!s||!g)return;const stage=g.steps[Math.min(step,g.steps.length-1)],progress=Math.round(step/g.steps.length*100);const buttons=stage.choices.map((c,i)=>`<button class="mg-action" data-mg="${i}"><span style="font-size:25px;display:block">${c[0]}</span>${c[1]}</button>`).join('');const board=id==='tower'?`<div style="display:flex;justify-content:center;align-items:end;gap:5px;height:74px">${Array.from({length:Math.min(step+1,5)},(_,i)=>`<span style="display:block;width:34px;height:${25+i*7}px;border-radius:7px;background:${['#d69b55','#8baf87','#d8c17a','#77a9b0','#c48eaa'][i]}"></span>`).join('')}</div>`:id==='picnic'?'<div style="font-size:34px;letter-spacing:8px">🧒 🧺 🧒</div>':id==='space'?'<div style="font-size:34px">🐉 <span style="color:#e8f4ff">⭕</span> 🧒</div>':id==='path'?'<div style="font-size:34px">🌲　🪨　🌳<br>↘　↙　↘<br>💎　🌉　🏡</div>':id==='no'?'<div style="font-size:36px">🧒　💬　🧑</div>':id==='belongings'?'<div style="font-size:36px">🍃　🧩　🌳</div>':id==='misunderstanding'?'<div style="font-size:36px">🧒　🗨️　🧑</div>':'<div style="font-size:36px">🏞️　🪵　🌉</div>';openModal(s.title,`<div class="minigame"><div class="mg-scene"><div class="mg-emoji">${g.emoji}</div><b>${g.scene}</b>${board}</div><div class="mg-progress"><i style="width:${progress}%"></i></div><p class="muted">Adventure ${step+1} of ${g.steps.length} · ${s.area}</p><h3 style="margin:0">${stage.title}</h3><div class="mg-board">${buttons}</div><p class="mg-note">There is no timer and no wrong choice. Explore at your own pace.</p></div>`,[{label:'Pause adventure',action:showAdventures,close:false}]);document.querySelectorAll('[data-mg]').forEach(el=>el.onclick=()=>{const choice=stage.choices[Number(el.dataset.mg)],nextHistory=[...history,choice[1]];sayLine(choice[1]);if(step+1<g.steps.length){playMiniGame(id,step+1,nextHistory)}else{scenarioDone(id);openModal('Adventure complete! 🎉',`<div class="mg-scene"><div class="mg-emoji">${g.emoji}</div><b>You explored ${s.title}!</b></div><p>You tried: ${nextHistory.map(x=>'• '+x).join('<br>')}</p><p><b>Skills explored:</b> ${s.skill}</p><p>You can replay this adventure, choose another, or return to the valley. Your progress is saved without scores or penalties.</p>`,[{label:'Play again',className:'primary',action:()=>playMiniGame(id),close:false},{label:'Other adventures',action:showAdventures,close:false},{label:'Back to valley',action:()=>{}}])}})}

function playTowerPuzzle(){
 const colours=[
  {id:'pink',emoji:'🩷',name:'Pink'},
  {id:'yellow',emoji:'⭐',name:'Yellow'},
  {id:'blue',emoji:'💎',name:'Blue'},
  {id:'green',emoji:'🍀',name:'Green'},
  {id:'purple',emoji:'🍇',name:'Purple'}
 ];
 const size=6,goal=10;let board=[],selected=-1,floors=0,moves=25,matched=0,locked=false;
 const rand=()=>Math.floor(Math.random()*colours.length);
 function hasMatch(b){for(let r=0;r<size;r++)for(let c=0;c<size;c++){let v=b[r*size+c];if(c>1&&b[r*size+c-1]===v&&b[r*size+c-2]===v)return true;if(r>1&&b[(r-1)*size+c]===v&&b[(r-2)*size+c]===v)return true;}return false}
 function makeBoard(){board=[];for(let i=0;i<size*size;i++){let v=rand();while((i%size>1&&board[i-1]===v&&board[i-2]===v)||(i>=size*2&&board[i-size]===v&&board[i-size*2]===v))v=rand();board.push(v)}}
 function getMatches(){let found=new Set();for(let r=0;r<size;r++){let c=0;while(c<size){let v=board[r*size+c],e=c+1;while(e<size&&board[r*size+e]===v)e++;if(e-c>=3)for(let x=c;x<e;x++)found.add(r*size+x);c=e;}}for(let c=0;c<size;c++){let r=0;while(r<size){let v=board[r*size+c],e=r+1;while(e<size&&board[e*size+c]===v)e++;if(e-r>=3)for(let y=r;y<e;y++)found.add(y*size+c);r=e;}}return found}
 function settle(){let chain=0;while(true){let m=getMatches();if(!m.size)break;chain++;matched+=m.size;floors+=Math.max(1,Math.floor(m.size/3));for(let c=0;c<size;c++){let kept=[];for(let r=size-1;r>=0;r--){let i=r*size+c;if(!m.has(i))kept.push(board[i]);}while(kept.length<size)kept.push(rand());for(let r=size-1;r>=0;r--)board[r*size+c]=kept[size-1-r];}}return chain}
 function render(message='Match 3 or more blocks to grow your tower!'){
  const cells=board.map((v,i)=>`<button type="button" data-wt-cell="${i}" aria-label="${colours[v].name} block" style="aspect-ratio:1;border:3px solid ${selected===i?'#fff':'#ffffff30'};outline:${selected===i?'3px solid #ffcf5a':'none'};border-radius:13px;background:linear-gradient(145deg,${['#ff8cb3','#ffd76a','#83d5f2','#8fe0a4','#c5a0f5'][v]},${['#e94f8c','#e8a92c','#328bc2','#3eae6c','#8955c7'][v]});font-size:clamp(23px,6vw,34px);box-shadow:inset 0 -4px #0002,0 3px 5px #0002;padding:2px;touch-action:manipulation">${colours[v].emoji}</button>`).join('');
  const tower=Array.from({length:Math.min(floors,goal)},(_,i)=>`<span style="display:block;width:${Math.max(42,94-i*3)}%;height:15px;margin:2px auto;border-radius:5px;background:${['#ff9fc2','#ffd66e','#8fd6ef','#9cdda9','#c4a2f1'][i%5]};box-shadow:0 3px 0 #0002"></span>`).join('');
  const won=floors>=goal;
  openModal('🍬 The Great Wobbly Tower',`<div style="display:grid;gap:12px"><div style="border-radius:18px;padding:13px;background:linear-gradient(135deg,#ffe8f3,#e9e4ff);color:#54345e;text-align:center"><div style="font-size:35px">🏰</div><b style="font-size:18px">Build a tower with colour matches!</b><p style="margin:5px 0 0;font-size:13px">Swap two touching blocks. Match 3 or more of the same colour to add blocks to your tower.</p></div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="pill">🏗️ Tower: ${Math.min(floors,goal)} / ${goal}</span><span class="pill">👆 Moves: ${moves}</span><span class="pill">✨ Matches: ${matched}</span></div><div style="min-height:128px;border-radius:16px;background:linear-gradient(#b8e9ff,#e7f8ff 70%,#b5e5c4);padding:8px;display:flex;flex-direction:column;justify-content:end;overflow:hidden"><div style="text-align:center;font-size:12px;color:#35566b;margin-bottom:5px">${won?'You built a brilliant tower!': 'Your colourful tower'}</div><div style="min-height:8px">${tower}</div><div style="height:9px;background:#69b77b;border-radius:8px;margin-top:5px"></div></div><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:7px;border-radius:16px;background:linear-gradient(145deg,#a98bd0,#7965ad);box-shadow:inset 0 3px 10px #30204b55">${cells}</div><p style="margin:0;text-align:center;font-size:13px;min-height:20px;color:var(--muted)">${message}</p><p style="margin:0;text-align:center;font-size:12px;color:var(--muted)">No timer. Take your time. If a swap doesn't make a match, the blocks return to their places.</p></div>`,[{label:'Pause game',action:showAdventures,close:false},{label:'Start again',action:()=>playTowerPuzzle(),close:false}]);
  document.querySelectorAll('[data-wt-cell]').forEach(el=>el.onclick=()=>tap(Number(el.dataset.wtCell)));
  if(won){$('modalButtons').innerHTML='<button class="btn primary" id="wtAgain">Build another tower</button><button class="btn" id="wtBack">Back to adventures</button>';$('wtAgain').onclick=()=>playTowerPuzzle();$('wtBack').onclick=showAdventures;}
  if(moves<=0&&!won){$('modalButtons').innerHTML='<button class="btn primary" id="wtContinue">Keep building</button><button class="btn" id="wtAgain">Start a fresh tower</button><button class="btn" id="wtBack">Back to adventures</button>';$('wtContinue').onclick=()=>{moves=15;render('Here are 15 more moves. Keep experimenting!')};$('wtAgain').onclick=()=>playTowerPuzzle();$('wtBack').onclick=showAdventures;}
 }
 function tap(i){if(locked||floors>=goal||moves<=0)return;if(selected<0){selected=i;render('Choose a block next to this one.');return;}if(selected===i){selected=-1;render();return;}let a=selected,b=i,ar=Math.floor(a/size),ac=a%size,br=Math.floor(b/size),bc=b%size;if(Math.abs(ar-br)+Math.abs(ac-bc)!==1){selected=i;render('Choose a block beside the highlighted one.');return;}[board[a],board[b]]=[board[b],board[a]];let m=getMatches();if(!m.size){[board[a],board[b]]=[board[b],board[a]];selected=-1;render('That swap did not make a match. Try another pair.');return;}selected=-1;moves--;const chain=settle();let msg=chain>1?'Combo! The tower grew extra tall!': 'Great match! Your tower grew!';if(floors>=goal){floors=goal;msg='Amazing building! You reached the top!';scenarioDone('tower');}render(msg);}
 makeBoard();render();
}

function runScenario(id){playMiniGame(id)}
function showAdventures(){const stories=scenarios.map(s=>`<button class="choice" data-scenario="${s.id}"><b>📖 ${s.title}</b><span>${s.area}${state.completed.includes(s.id)?' · ★ explored':''}</span></button>`).join('');const games=[['builder','🏗️','Build & Tell','Create a build and share your idea'],['feelings','🌤️','Feelings Quest','Notice feelings and choose a support'],['together','🤝','Team Quest','Explore friendship and different ideas'],['focus','🔎','Focus Finder','Patterns, attention and memory'],['creature','🐾','Creature Care','Notice what a creature might need'],['treasure','🗝️','Treasure Trail','Remember a gentle symbol sequence'],['weather','🌦️','Weather Station','Match weather with comfort choices'],['bridge','🌉','Bridge Builder','Build a path using blocks'],['story','📚','Story Portal','Create an original adventure']];const cards=games.map(g=>`<button class="choice" data-mini="${g[0]}"><b>${g[1]} ${g[2]}</b><span>${g[3]}</span></button>`).join('');openModal('Adventure & Play Hub',`<p>Pick a story or a creative game. You can leave at any time, replay favourites or just keep exploring the world. Nothing is timed and no progress is lost when you take a break.</p><h3>Story adventures</h3><div class="cardgrid">${stories}</div><h3 style="margin-top:18px">Creative mini-games</h3><div class="cardgrid">${cards}</div><div class="footer">These are optional play experiences, not tests. You can talk, type, point, choose a picture or simply explore.</div>`);document.querySelectorAll('[data-scenario]').forEach(el=>el.onclick=()=>runScenario(el.dataset.scenario));document.querySelectorAll('[data-mini]').forEach(el=>el.onclick=()=>startMiniGame(el.dataset.mini))}
function sayLine(text){if(!state.settings.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1.03;speechSynthesis.speak(u)}catch{}}
function startMiniGame(id){
 const names={builder:'Build & Tell',feelings:'Feelings Quest',together:'Team Quest',focus:'Focus Finder',creature:'Creature Care',treasure:'Treasure Trail',weather:'Weather Station',bridge:'Bridge Builder',story:'Story Portal'};
 const runners={builder:miniBuilder,feelings:miniFeelings,together:miniTogether,focus:miniFocus,creature:miniCreature,treasure:miniTreasure,weather:miniWeather,bridge:miniBridge,story:miniStory};
 (runners[id]||miniBuilder)(names[id]||'Mini-game');
}
function miniBuilder(title){openModal(title,'<p>Imagine something you would love to build. There is no wrong design.</p><label for="buildIdea">My build idea</label><input id="buildIdea" class="btn" placeholder="A dragon castle, a treehouse…" style="width:100%"><div class="cardgrid"><button class="choice" data-idea="A cosy dragon home">🏡 Cosy dragon home</button><button class="choice" data-idea="A huge treehouse">🌳 Huge treehouse</button><button class="choice" data-idea="A secret underwater base">🌊 Underwater base</button><button class="choice" data-idea="My own idea">💡 My own idea</button></div><p class="muted">You can type, say it aloud or keep your idea in your head.</p>');document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>document.getElementById('buildIdea').value=b.dataset.idea);$('modalButtons').innerHTML='<button class="btn primary" id="saveBuildIdea">Save my idea</button><button class="btn" id="finishMini">Finish</button>';$('saveBuildIdea').onclick=()=>{const v=$('buildIdea').value||'My own build';state.toolbox.push('Build idea: '+v);save();toast('Your idea is saved!')};$('finishMini').onclick=showAdventures}
function miniFeelings(){const moods=[['😊','Happy'],['😟','Worried'],['😠','Frustrated'],['😴','Tired'],['🤩','Excited'],['😐','Not sure'],['😌','Calm'],['😕','Disappointed']];openModal('Feelings Quest','<p>How might your character be feeling? Choose one, more than one, or skip this.</p><div class="cardgrid">'+moods.map((m,i)=>`<button class="choice" data-mood="${i}"><b style="font-size:25px">${m[0]}</b><span>${m[1]}</span></button>`).join('')+'</div>');document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>miniCoping(moods[+b.dataset.mood]))}
function miniCoping(m){const options=['Pause or take a break','Ask someone I trust for help','Try a different plan','Move somewhere quieter','Keep doing what I enjoy'];openModal(m[1],`<p>${m[0]} It is okay to feel ${m[1].toLowerCase()}. Feelings can change or mix together.</p><p>Would any of these feel useful?</p><div class="btnrow" style="display:grid">${options.map(x=>`<button class="btn" data-coping="${x}">${x}</button>`).join('')}</div>`);document.querySelectorAll('[data-coping]').forEach(b=>b.onclick=()=>{state.toolbox.push(b.dataset.coping);save();openModal('Your choice',`<p>${b.dataset.coping} is one option. You can choose something different another time.</p>`,[{label:'Back to activities',className:'primary',action:showAdventures}])})}
function miniTogether(){const qs=[['Two builders want the same blocks. What could happen?',['Ask to build together','Take turns if both want','Find another set','Choose a different activity']],['A friend wants a different game. What could you do?',['Suggest a game you both like','Try their idea for a while','Play separately and meet later','Share what I would prefer']],['Someone says “not now”. What could you do?',['Give them space','Ask about another time','Find something else to enjoy','Take a moment if disappointed']]];let n=0;function show(){const q=qs[n];openModal('Team Quest',`<p>${q[0]}</p><div class="btnrow" style="display:grid">${q[1].map(x=>`<button class="btn" data-team="${x}">${x}</button>`).join('')}</div><p class="muted">Different people may choose different things. There is no single right answer.</p>`);document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>openModal('An idea to explore',`<p>You chose: <b>${b.dataset.team}</b></p><p>That is one possible way to handle the situation. Other people might choose differently.</p>`,[{label:n<qs.length-1?'Next situation':'Finish',className:'primary',action:()=>{n++;if(n<qs.length)show();else showAdventures()}}]))}show()}
function miniFocus(){const patterns=[['🟩','🟦','🟩','🟦'],['⭐','🌙','⭐','🌙'],['🐉','🌳','💎','🐉']];let n=0;function show(){const p=patterns[n];const answer=p[0];openModal('Focus Finder',`<p>Look at the pattern, then choose what comes next. Take your time.</p><div class="prompt" style="font-size:30px;text-align:center;letter-spacing:8px">${p.join(' ')} ?</div><div class="cardgrid">${[answer,'🟨','🐲','🌸'].map((v,i)=>`<button class="choice" data-pattern="${v}"><b style="font-size:28px">${v}</b><span>Choice ${i+1}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-pattern]').forEach(b=>b.onclick=()=>openModal('Pattern explorer',`<p>${b.dataset.pattern===answer?'You spotted a repeating pattern!':'Good exploring. Patterns can be tricky to spot.'} The pattern repeats ${p[0]} ${p[1]}.</p>`,[{label:n<patterns.length-1?'Next pattern':'Finish',className:'primary',action:()=>{n++;if(n<patterns.length)show();else showAdventures()}}]))}show()}
function miniCreature(){const options=['A quiet resting spot','Some space to explore','A friend to play with','A drink of water','A different activity'];openModal('Creature Care','<p>A tiny block creature is visiting. What might it like?</p><div class="prompt" style="font-size:48px;text-align:center">🐲 🐾</div><div class="btnrow" style="display:grid">'+options.map(x=>`<button class="btn" data-care="${x}">${x}</button>`).join('')+'</div><p class="muted">Different creatures and people can need different things. You can ask, observe or make a guess.</p>');document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>openModal('Creature care',`<p>You chose: ${b.dataset.care}. You helped the creature explore what might feel good.</p>`,[{label:'Try another',className:'primary',action:miniCreature},{label:'Finish',action:showAdventures}]))}
function miniTreasure(){const seq=['🟩','💎','🐉'];let step=0;openModal('Treasure Trail',`<p>Remember this little trail. When you are ready, tap the same symbols in order.</p><div class="prompt" style="font-size:34px;text-align:center;letter-spacing:9px">${seq.join(' ')}</div>`,[{label:'Hide the trail',className:'primary',action:ask}]);function ask(){openModal('Treasure Trail',`<p>Choose symbol ${step+1} of ${seq.length}.</p><div class="cardgrid">${['🟩','💎','🐉','🌸'].map(x=>`<button class="choice" data-treasure="${x}" style="font-size:30px">${x}</button>`).join('')}</div>`);document.querySelectorAll('[data-treasure]').forEach(b=>b.onclick=()=>{if(b.dataset.treasure===seq[step]){step++;if(step===seq.length)openModal('Treasure found!',`<p>You remembered the whole trail. Nice exploring!</p>`,[{label:'Again',className:'primary',action:miniTreasure},{label:'Finish',action:showAdventures}]);else ask()}else openModal('Keep exploring',`<p>That was a different symbol. You can try again or reveal the trail. There is no penalty.</p>`,[{label:'Try again',className:'primary',action:ask},{label:'Show trail',action:miniTreasure},{label:'Finish',action:showAdventures}])})}}
function miniWeather(){const ws=[['☀️','Sunny','A movement break, water or shade'],['🌧️','Rainy','A cosy space or favourite activity'],['🌬️','Windy','A quieter spot or something steady'],['⛈️','Stormy','A trusted person or a calm place']];openModal('Weather Station','<p>Choose a kind of weather. What might help your character enjoy the day?</p><div class="cardgrid">'+ws.map((w,i)=>`<button class="choice" data-weather="${i}"><b style="font-size:26px">${w[0]}</b><span>${w[1]}</span></button>`).join('')+'</div>');document.querySelectorAll('[data-weather]').forEach(b=>{const w=ws[+b.dataset.weather];b.onclick=()=>openModal(w[1],`<p>${w[0]} ${w[1]} day.</p><p>One idea might be: ${w[2]}. What would you choose?</p>`,[{label:'That sounds good',className:'primary',action:showAdventures},{label:'Choose another weather',action:miniWeather}])})}
function miniBridge(){let slots=[false,false,false,false,false];function draw(){openModal('Bridge Builder',`<p>Build a bridge across the stream. Tap each space to add or remove a block. There is no wrong design.</p><div class="cardgrid" style="grid-template-columns:repeat(5,1fr)">${slots.map((v,i)=>`<button class="choice" data-slot="${i}" style="min-height:65px;text-align:center;font-size:25px">${v?'🧱':'⬜'}</button>`).join('')}</div><p class="muted">${slots.filter(Boolean).length} of 5 spaces filled</p>`);document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{slots[+b.dataset.slot]=!slots[+b.dataset.slot];draw()});$('modalButtons').innerHTML='<button class="btn" id="clearBridge">Clear bridge</button><button class="btn primary" id="finishBridge">Finish building</button>';$('clearBridge').onclick=()=>{slots=[false,false,false,false,false];draw()};$('finishBridge').onclick=showAdventures}draw()}
function miniStory(){const parts=[['Who is the hero?',['A dragon 🐉','A brave builder 👦','A friendly robot 🤖']],['Where do they go?',['Crystal Cave 💎','Mushroom Forest 🍄','Floating Island ☁️']],['What happens?',['A surprise visitor 🎁','A wobbly bridge 🌉','A hidden treasure ⭐']]];let n=0,chosen=[];function show(){openModal('Story Portal',`<p>${parts[n][0]}</p><div class="btnrow" style="display:grid">${parts[n][1].map((x,i)=>`<button class="btn" data-story="${i}">${x}</button>`).join('')}</div>`,[{label:'Skip this part',action:()=>{chosen.push('something unexpected');next()} }]);document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{chosen.push(parts[n][1][+b.dataset.story]);next()})}function next(){n++;if(n<parts.length)show();else finish()}function finish(){openModal('Your story!',`<p>${chosen.join(' travels to ')}.</p><p>You made your own story. You can change any part whenever you like.</p>`,[{label:'Make another story',className:'primary',action:miniStory},{label:'Finish',action:showAdventures}])}show()}
function showPlaces(){const places=[['village','🏡','Village Home','A cosy place to make a room feel like yours.',[-5,0,-4]],['cave','💎','Crystal Cave','A quiet cave with glowing crystals and space to explore.',[12,0,8]],['grove','🍄','Mushroom Grove','A gentle place to meet tiny creatures and look around.',[-9,0,-9]],['pond','🌊','Bluebell Pond','A peaceful place beside the water.',[5,0,4]],['lookout','☁️','Floating Lookout','A high place to imagine a new adventure.',[-2,0,13]]];openModal('Places in Greenblock Valley',`<p>Choose somewhere to visit. You can return to the valley whenever you like.</p><div class="cardgrid">${places.map(p=>`<button class="choice" data-place="${p[0]}"><b>${p[1]} ${p[2]}</b><span>${p[3]}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x[0]===b.dataset.place);state.visited=Array.isArray(state.visited)?state.visited:[];if(!state.visited.includes(p[0]))state.visited.push(p[0]);state.player=[p[4][0],0,p[4][2]];player.position.set(...state.player);save();const decor=(state.roomDecor||[]).map(x=>`<span class="pill" style="display:inline-block;margin:4px">${x}</span>`).join('');const extras=p[0]==='village'?`<p>Pick a cosy detail for your room:</p><div class="btnrow">${['🛏️ Bed','🪴 Plant','🖼️ Picture','🧸 Soft toy','📚 Bookshelf','🪟 Window'].map(x=>`<button class="btn" data-decor="${x}">${x}</button>`).join('')}</div><p class="muted">Your saved room decorations:</p><div>${decor||'No decorations yet.'}</div>`:p[0]==='cave'?'<p>Look for a crystal, take a quiet moment or ask your dragon to explore beside you.</p>':p[0]==='grove'?'<p>Imagine what a little creature might enjoy: a resting spot, a friend, space or a new game.</p>':p[0]==='pond'?'<p>You can pause here, watch the water or choose a quiet activity. No task is waiting.</p>':'<p>Look across the valley and invent a story about somewhere you would like to explore next.</p>';openModal(p[2],`<p>${p[3]}</p>${extras}`,[{label:'Back to places',className:'primary',action:showPlaces},{label:'Back to world',action:closeModal}]);document.querySelectorAll('[data-decor]').forEach(d=>d.onclick=()=>{state.roomDecor=Array.isArray(state.roomDecor)?state.roomDecor:[];state.roomDecor.push(d.dataset.decor);save();toast('Decoration saved to your room!');showPlaces()})})}
function showToolbox(){const tools=[['🌿','I need a break','Find a quiet place or pause the game.','break'],['🙋','I need help','Practise asking a person or dragon for help.','help'],['😤','I feel frustrated','Notice the feeling and choose what might help.','frustrated'],['🗣️','I need to say something','Try words for a need, boundary or request.','speak'],['🔄','Plans changed','Explore another option or ask for more information.','change'],['🧘','Help my body feel settled','Try a gentle breathing or sensory choice.','calm'],['🛑','I want something to stop','Practise clear words and getting trusted adult help.','stop'],['💡','I have an idea','Save a personal strategy that works for you.','idea']];const html='<p>Your toolbox is always available. Pick a tool that feels useful, or close this window. You do not have to use any of them.</p><div class="toolbox">'+tools.map(t=>`<button class="tool" data-tool="${t[3]}"><span style="font-size:23px">${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small></button>`).join('')+'</div><div class="footer">A tool is an option, not an instruction. If something feels unsafe, uncomfortable or too much, it is okay to move away and ask a trusted adult for help.</div>';openModal('My Dragon Toolbox',html);document.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>toolDetail(el.dataset.tool))}
function toolDetail(id){const data={break:['Taking a break','You can pause, sit somewhere quiet, stretch, get a drink or do something you enjoy. You do not lose progress by taking a break.',['Quiet garden','Stretch','Drink of water','Return later']],help:['Asking for help','Try a phrase, show a picture, point to the help button or ask a trusted person to come over.',['Can you help me?','I’m not sure what to do.','Can you show me?']],frustrated:['When I feel frustrated','Frustration can be a signal that something is hard, unexpected or not working. You do not have to make the feeling vanish.',['Pause for a moment','Try a different plan','Ask for help','Move to a calmer place']],speak:['Words I can use','You can say these, type them, point to them or choose a picture.',['Please stop.','I need some space.','I don’t like that.','Can you explain?','I need help.']],change:['When plans change','You can ask what changed, find out what happens next, choose another plan or take time to think.',['What changed?','What happens next?','Show me my choices.','I need a minute.']],calm:['Help my body feel settled','Different things help different people. Choose what feels comfortable. You can skip all of these.',['Slow gentle breaths','Listen to a quiet sound','Look at a familiar picture','Rock or move gently','Find a quieter space']],stop:['When I want something to stop','Your body and belongings matter. You can use a clear stop message and move away. If someone does not respect it or you feel unsafe, tell a trusted adult.',['Stop, please.','I don’t want that.','Move back, please.','I’m getting a trusted adult.']],idea:['My own helpful idea','What helps you when something feels tricky? You can choose a strategy to remember.',['Build something else','Talk to someone I trust','Take a quiet break','Use my own words']]};const d=data[id];const html=`<p>${d[1]}</p><div class="btnrow" style="display:grid;grid-template-columns:1fr">${d[2].map(x=>`<button class="btn" data-phrase="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}</div><p class="muted">Choose one to save it to your personal toolbox, or just explore it without saving.</p>`;openModal(d[0],html);document.querySelectorAll('[data-phrase]').forEach(el=>el.onclick=()=>{const p=el.dataset.phrase;if(!state.toolbox.includes(p)){state.toolbox.push(p);save()}toast('Added to My Toolbox.');openModal('Saved to My Toolbox',`<p>“${p}” is in your toolbox. You can use it in the game whenever you want.</p>`,[{label:'Back to toolbox',className:'primary',action:showToolbox}])})}
function showParentCorner(){const explored=scenarios.filter(s=>state.completed.includes(s.id));const tools=state.toolbox.length?state.toolbox.map(x=>`<li>${x}</li>`).join(''):'<li>No personal strategies saved yet.</li>';const rows=scenarios.map(s=>`<li>${s.title}: ${state.completed.includes(s.id)?'Explored':'Not explored yet'}</li>`).join('');openModal('Parent Corner',`<p>This private-on-device overview is for noticing what your child chooses to explore. It is not a behaviour score, developmental assessment or measure of progress.</p><div class="activity"><h3>Adventure journal</h3><p>${explored.length} of ${scenarios.length} adventures explored</p><div class="bar"><i style="width:${Math.round(explored.length/scenarios.length*100)}%"></i></div><ul>${rows}</ul></div><div class="activity"><h3>Strategies saved in My Toolbox</h3><ul>${tools}</ul></div><div class="activity"><h3>Ideas for supporting play</h3><ul><li>Follow his interests and let him choose the activity.</li><li>Accept speech, pointing, typing, pictures or in-game actions.</li><li>Talk about a scenario only if he wants to; don't quiz him afterwards.</li><li>Notice which options he returns to and offer those tools in real life when appropriate.</li><li>If a scenario feels uncomfortable, skip it or adapt it together.</li></ul></div><p class="muted">All progress is stored in this browser on this device. Export a backup if you want to keep it. Block Buddy is an enjoyable practice environment, not therapy or a diagnostic tool.</p>`,[{label:'Back to world settings',className:'primary',action:showMenu}])}
function showMenu(){openModal('Your Block Buddy world',`<p>Make the world feel comfortable. Your choices are saved on this device.</p><div class="activity"><h3>Choose your adventurer</h3><div class="cardgrid"><button class="choice ${state.character==='blue'?'selected':''}" data-character="blue"><b>👦 Blue shirt</b><span>Blonde boy adventurer</span></button><button class="choice ${state.character==='purple'?'selected':''}" data-character="purple"><b>👦 Purple shirt</b><span>Blonde boy adventurer</span></button></div></div><div class="activity"><h3>Choose your dragon companion</h3><div class="cardgrid">${Object.entries(dragonDefs).map(([k,d])=>`<button class="choice ${state.dragon===k?'selected':''}" data-dragon="${k}"><b>🐉 ${d.name}</b><span>${d.description}</span></button>`).join('')}</div></div><div class="activity"><h3>Comfort & access settings</h3><p class="muted">All settings are optional. Change them whenever you like.</p><button class="btn" id="motionToggle">Reduced movement: ${state.settings.motion?'Off':'On'}</button><button class="btn" id="quietToggle">Quiet prompts: ${state.settings.quiet?'On':'Off'}</button><button class="btn" id="voiceToggle">Read story aloud: ${state.settings.voice?'On':'Off'}</button><button class="btn" id="openEndedToggle">Open-ended prompts: ${state.settings.openEnded?'On':'Off'}</button><button class="btn" id="largeTextToggle">Larger text: ${state.settings.largeText?'On':'Off'}</button></div><div class="activity"><h3>Save & family tools</h3><p>${state.completed.length} adventures explored · ${state.toolbox.length} saved ideas · ${state.built.length} blocks built</p><button class="btn" id="visitPlaces">🗺 Visit places in Greenblock Valley</button><button class="btn" id="parentCorner">👨‍👩‍👦 Parent Corner</button><button class="btn" id="exportSave">⬇ Export my world save</button><button class="btn" id="importSave">⬆ Import a world save</button><button class="btn" id="resetWorld">↻ Reset the world layout</button><input type="file" id="saveFile" accept="application/json" hidden></div><div class="footer">Block Buddy stores saves in this browser on this device. Export a backup before clearing browser data or changing devices. It is a family play tool, not a medical treatment or replacement for professional support.</div>`);document.querySelectorAll('[data-character]').forEach(el=>el.onclick=()=>{state.character=el.dataset.character;makeCharacter(state.character);save();showMenu()});document.querySelectorAll('[data-dragon]').forEach(el=>el.onclick=()=>{state.dragon=el.dataset.dragon;makeDragon(state.dragon);save();showMenu()});$('motionToggle').onclick=()=>{state.settings.motion=!state.settings.motion;save();showMenu()};$('quietToggle').onclick=()=>{state.settings.quiet=!state.settings.quiet;save();$('hint').textContent=state.settings.quiet?'Explore at your own pace.':'Your world is ready. Try the Toolbox whenever you want.';showMenu()};$('voiceToggle').onclick=()=>{state.settings.voice=!state.settings.voice;save();showMenu()};$('openEndedToggle').onclick=()=>{state.settings.openEnded=!state.settings.openEnded;save();showMenu()};$('largeTextToggle').onclick=()=>{state.settings.largeText=!state.settings.largeText;document.body.classList.toggle('large-text',state.settings.largeText);save();showMenu()};$('visitPlaces').onclick=showPlaces;$('parentCorner').onclick=showParentCorner;$('exportSave').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='block-buddy-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importSave').onclick=()=>$('saveFile').click();$('saveFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text());state={...defaults,...d,settings:{...defaults.settings,...(d.settings||{})}};save();location.reload()}catch{toast('That save file could not be read.')}};$('resetWorld').onclick=()=>{if(confirm('Reset the world layout and collected resources? Your adventures and saved toolbox will remain.')){state.wood=0;state.stone=0;state.built=[];state.player=[0,0,0];save();location.reload()}}}
// Build/collect and buttons
$('collect').onclick=collect;$('build').onclick=build;$('toolboxBtn').onclick=showToolbox;$('adventuresBtn').onclick=showAdventures;$('menuBtn').onclick=showMenu;
// Tap the dragon greeting from the hint panel; no spoken response is required.
$('hint').style.cursor='pointer';$('hint').title='Tap to hear from your dragon';$('hint').addEventListener('click',()=>dragonHello());
// Friendly optional dragon greeting, no speech required
function dragonHello(){const d=dragonDefs[state.dragon];sayLine(`Hello, explorer. I'm ${d.name}. We can build, try an adventure, use your toolbox or just wander. You choose.`);openModal(`${d.name} says hello!`,`I’m glad we’re exploring together. We can build, try an adventure, use the toolbox or just wander. You choose.`,[{label:'Explore together',className:'primary',action:()=>closeModal()},{label:'Open my toolbox',action:showToolbox}])}
// Simple quest / story prompt available through village interaction (also via adventures menu)
$('hint').textContent=state.settings.quiet?'Explore at your own pace.':'Welcome to Greenblock Valley! Walk into a glowing portal to discover mini-games. Meet your dragon and explore at your own pace.';
updateHUD();
// Camera and movement orientation are consistent: forward is away from the camera; left/right are screen-relative.
// Character model's face is built toward local -Z, so this rotation keeps the face aligned with movement.
function setReducedMotion(){const reduced=!state.settings.motion;scene.fog.near=reduced?28:23;scene.fog.far=reduced?65:58;}
setReducedMotion();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const speed=4.2;const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const move=new THREE.Vector3();if(held.forward)move.add(forward);if(held.back)move.sub(forward);if(held.right)move.add(right);if(held.left)move.sub(right);if(Math.abs(touchX)+Math.abs(touchY)>.06){move.addScaledVector(right,touchX);move.addScaledVector(forward,-touchY)}if(move.lengthSq()){move.normalize().multiplyScalar(speed*dt);player.position.add(move);player.position.x=THREE.MathUtils.clamp(player.position.x,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);faceMovement(move)}const t=clock.elapsedTime;portalRing.rotation.z=t*.32;portalCore.material.opacity=.28+Math.sin(t*2.2)*.12;portalGates.forEach((p,i)=>{p.ring.rotation.z=t*(.28+i*.035);p.core.material.opacity=.24+Math.sin(t*2+i)*.12;p.light.intensity=.9+Math.sin(t*2.4+i)*.28});checkPortalEntry(t);floatingRealms.forEach((island,i)=>{island.position.y=[7,9,11][i]+Math.sin(t*.55+i)*.18;island.rotation.y=Math.sin(t*.18+i)*.04});if(player.userData.limbs){const swing=state.settings.motion&&move.lengthSq()?Math.sin(t*11)*.42:0;player.userData.limbs.arms.forEach((a,i)=>a.rotation.x=(i?1:-1)*swing);player.userData.limbs.legs.forEach((l,i)=>l.rotation.x=(i?-1:1)*swing)}if(dragon.userData.wings&&state.settings.motion){dragon.userData.wings.forEach((w,i)=>w.rotation.z=(i===0?-1:1)*(.35+Math.sin(t*7)*.16))}dragon.position.x=THREE.MathUtils.damp(dragon.position.x,player.position.x+Math.sin(t*1.7)*1.05,3,dt);dragon.position.z=THREE.MathUtils.damp(dragon.position.z,player.position.z+1.3+Math.cos(t*1.3)*.4,3,dt);dragon.position.y=state.settings.motion ? 0.2+Math.sin(t*2.5)*0.13 : 0.15;dragon.rotation.y=Math.sin(t)*.12;const target=new THREE.Vector3(player.position.x,player.position.y+0.65,player.position.z);const offset=new THREE.Vector3(0,10.5,14.5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(target.clone().add(offset),.075);camera.lookAt(target.x,target.y,target.z);if(state.settings.motion){clouds.forEach((c,i)=>{c.position.x+=Math.sin(t*.12+i)*dt*.08});if(!move.lengthSq())player.position.y=.035+Math.sin(t*2.2)*.025;else player.position.y=Math.abs(Math.sin(t*11))*.055;}else player.position.y=0;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{const aspect=innerWidth/innerHeight;camera.left=-12*aspect;camera.right=12*aspect;camera.top=12;camera.bottom=-12;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setInterval(()=>{state.player=[player.position.x,player.position.y,player.position.z];save()},4000);document.addEventListener('visibilitychange',()=>{if(document.hidden){state.player=[player.position.x,player.position.y,player.position.z];save()}});addEventListener('beforeunload',()=>{state.player=[player.position.x,player.position.y,player.position.z];save()});updateHUD();
} catch (error) {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.style.display = 'flex';
    loading.innerHTML = '<div class="loadcard"><strong>Block Buddy could not load yet.</strong><small>Check your internet connection and reload. The 3D engine is loaded securely from a CDN. Your saved world has not been deleted.</small><p><button class="btn primary" onclick="location.reload()">Try loading again</button></p></div>'; 
  }
  console.error('Block Buddy startup error:', error);
}
</script>
